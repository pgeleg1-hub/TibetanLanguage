<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tibetan Sunday School Interactive Lesson</title>

  <!-- Allowed External Resources -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&amp;family=Fredoka:wght@400;600;700&amp;family=Noto+Serif+Tibetan:wght@400;600;700;900&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #f7f9fa;
      color: #3c3c3c;
      user-select: none;
      -webkit-user-select: none;
    }
    .tibetan-text {
      font-family: 'Noto Serif Tibetan', serif;
      line-height: 1.8;
    }
    /* Balanced font size for Tibetan inputs inside Teacher Mode Editor */
    #editor-content input.tibetan-text {
      font-size: 1.125rem !important; /* 18px for clear reading and comfortable editing */
      line-height: 1.6;
    }
    .font-fredoka {
      font-family: 'Fredoka', sans-serif;
    }

    /* Duolingo-style custom UI elements */
    .duo-card {
      border: 2px solid #e5e5e5;
      border-bottom-width: 4px;
      transition: all 0.15s ease-in-out;
    }
    .duo-card:hover:not(.disabled):not(.matched) {
      border-color: #cecece;
      background-color: #f7f7f7;
    }
    .duo-card.selected {
      border-color: #84d8ff;
      background-color: #ddf4ff;
      color: #1cb0f6;
    }
    .duo-card.matched {
      border-color: #e5e5e5;
      background-color: #f3f4f6;
      color: #9ca3af !important;
      opacity: 0.5;
      cursor: default;
      pointer-events: none;
      border-bottom-width: 2px;
    }
    .duo-card.wrong {
      border-color: #fca5a5;
      background-color: #fef2f2;
      color: #ef4444;
    }

    .duo-tile {
      border: 2px solid #e5e5e5;
      border-bottom-width: 4px;
      background-color: #ffffff;
      transition: all 0.12s ease;
      cursor: pointer;
    }
    .duo-tile:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .duo-tile.used {
      background-color: #e5e5e5;
      border-color: #e5e5e5;
      color: transparent !important;
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }

    .duo-btn-green {
      background-color: #58cc02;
      border-bottom: 4px solid #46a302;
      color: white;
    }
    .duo-btn-green:hover:not(:disabled) {
      background-color: #61e002;
    }
    .duo-btn-green:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .duo-btn-green:disabled {
      background-color: #e5e5e5;
      border-color: #cecece;
      color: #afafaf;
    }

    .speech-bubble {
      position: relative;
      background: #ffffff;
      border: 2px solid #e5e5e5;
      border-radius: 16px;
    }
    .speech-bubble::before {
      content: '';
      position: absolute;
      left: -12px;
      top: 50%;
      transform: translateY(-50%);
      border-style: solid;
      border-width: 10px 12px 10px 0;
      border-color: transparent #e5e5e5 transparent transparent;
      display: block;
      width: 0;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      left: -9px;
      top: 50%;
      transform: translateY(-50%);
      border-style: solid;
      border-width: 8px 10px 8px 0;
      border-color: transparent #ffffff transparent transparent;
      display: block;
      width: 0;
    }

    /* Right-pointing speech bubble for chat response character */
    .speech-bubble-right {
      position: relative;
      background: #ffffff;
      border-radius: 16px;
    }
    .speech-bubble-right::before {
      content: '';
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translateY(-50%);
      border-style: solid;
      border-width: 10px 0 10px 12px;
      border-color: transparent transparent transparent #7dd3fc;
      display: block;
      width: 0;
    }
    .speech-bubble-right::after {
      content: '';
      position: absolute;
      right: -9px;
      top: 50%;
      transform: translateY(-50%);
      border-style: solid;
      border-width: 8px 0 8px 10px;
      border-color: transparent transparent transparent #ffffff;
      display: block;
      width: 0;
    }

    /* Slot divider line */
    .slot-container {
      border-top: 2px solid #e5e5e5;
      border-bottom: 2px solid #e5e5e5;
      min-height: 80px;
    }
  </style>

  <script>
    // --- GLOBAL STATE ---
    let lessonData = { settings: { showPhonetics: true, showEnglish: true }, activities: [] };
    let currentActivityIndex = 0;
    let selectedOptionId = null;
    let selectedWordTileIds = [];
    let activityScores = {};
    let isTeacherMode = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let recordingTarget = null;
    let previewScrambledWordsMap = {};
    let previewScrambledMatchingMap = {};
    let isCurrentAnswerCorrect = false;

    // Matching Pairs State
    let selectedLeftMatchingId = null;
    let selectedRightMatchingId = null;
    let matchedPairIds = [];

    // --- AUDIO SOUND EFFECTS ENGINE (Comfortable Tones & Interaction Feedback) ---
    function playSoundEffect(type) {
      try {
        if (typeof Tone !== 'undefined') {
          Tone.start();
          const synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.01, decay: 0.15, sustain: 0.1, release: 0.2 }
          }).toDestination();

          const now = Tone.now();

          if (type === 'correct') {
            // Comfortable, warm major 5th interval (F4 -> C5)
            synth.triggerAttackRelease("F4", "8n", now, 0.25);
            synth.triggerAttackRelease("C5", "6n", now + 0.1, 0.3);
          } else if (type === 'wrong') {
            // Soft, low-pitch double pulse (G2 -> E2)
            synth.triggerAttackRelease("G2", "8n", now, 0.25);
            synth.triggerAttackRelease("E2", "8n", now + 0.12, 0.2);
          } else if (type === 'match_pair') {
            // Gentle success pop for pairing/matching (A4 -> E5)
            synth.triggerAttackRelease("A4", "16n", now, 0.2);
            synth.triggerAttackRelease("E5", "16n", now + 0.08, 0.25);
          } else if (type === 'tap') {
            // Soft subtle woodblock tap for tile/option selections
            synth.triggerAttackRelease("C4", "32n", now, 0.15);
          }
        } else {
          // Fallback to Web Audio API synthesized comfortable tones
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'correct') {
            osc.frequency.setValueAtTime(349.23, ctx.currentTime); // F4
            osc.frequency.setValueAtTime(523.25, ctx.currentTime + 0.1); // C5
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.35);
          } else if (type === 'wrong') {
            osc.frequency.setValueAtTime(98.00, ctx.currentTime); // G2
            osc.frequency.setValueAtTime(82.41, ctx.currentTime + 0.12); // E2
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.35);
          } else if (type === 'match_pair') {
            osc.frequency.setValueAtTime(440.00, ctx.currentTime); // A4
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08); // E5
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.25);
          } else if (type === 'tap') {
            osc.frequency.setValueAtTime(261.63, ctx.currentTime); // C4
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.08);
          }
        }
      } catch(e) {
        console.warn("Sound effect error", e);
      }
    }

    function playAnswerFeedbackSound(isCorrect) {
      playSoundEffect(isCorrect ? 'correct' : 'wrong');
    }

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const rawJson = document.getElementById('lesson-dataset').textContent;
        const parsed = JSON.parse(rawJson);
        lessonData = parsed;
        if (!lessonData.settings) {
          lessonData.settings = { showPhonetics: true, showEnglish: true };
        }
        if (parsed.scrambledWordsMap) {
          previewScrambledWordsMap = parsed.scrambledWordsMap;
        }
        if (parsed.scrambledMatchingMap) {
          previewScrambledMatchingMap = parsed.scrambledMatchingMap;
        }
      } catch (e) {
        console.error("Failed to parse lesson dataset JSON", e);
      }

      syncStudentTogglesUI();
      const actIds = lessonData.activities.map(a => a.id);
      reportToPlatform("ready", { activities: actIds });

      renderCurrentActivity();
      updateProgressBar();
    });

    function reportToPlatform(type, data) {
      window.parent.postMessage(
        Object.assign({ source: "tss-lesson", type: type }, data || {}), "*"
      );
    }

    function syncStudentTogglesUI() {
      const phonToggle = document.getElementById('toggle-phonetics-student');
      const engToggle = document.getElementById('toggle-english-student');
      if (phonToggle) phonToggle.checked = lessonData.settings.showPhonetics !== false;
      if (engToggle) engToggle.checked = lessonData.settings.showEnglish !== false;
    }

    // --- RENDER MAIN ENGINE ---
    function renderCurrentActivity() {
      const container = document.getElementById('lesson-container');
      container.innerHTML = '';
      resetFeedbackBanner();
      isCurrentAnswerCorrect = false;

      if (currentActivityIndex >= lessonData.activities.length) {
        renderLessonCompletion();
        return;
      }

      const act = lessonData.activities[currentActivityIndex];
      document.getElementById('activity-counter').innerText = `${currentActivityIndex + 1} / ${lessonData.activities.length}`;

      if (act.type === 'mcq') {
        renderMCQLayout(act, container);
      } else if (act.type === 'reorder') {
        renderReorderLayout(act, container);
      } else if (act.type === 'matching') {
        renderMatchingLayout(act, container);
      } else if (act.type === 'audio_reorder') {
        renderAudioReorderLayout(act, container);
      } else if (act.type === 'select_meaning') {
        renderSelectMeaningLayout(act, container);
      } else if (act.type === 'chat_complete') {
        renderChatCompleteLayout(act, container);
      }

      updateProgressBar();
      if (isTeacherMode) updateTeacherEditor();
    }

    // --- LAYOUT 1: MCQ ---
    function renderMCQLayout(act, container) {
      selectedOptionId = null;
      document.getElementById('btn-check').disabled = true;

      const titleEl = document.createElement('h1');
      titleEl.className = 'text-2xl font-bold text-center text-gray-800 mb-8 font-fredoka';
      titleEl.innerText = act.title || `Which one of these is “${act.targetEnglish}”?`;
      container.appendChild(titleEl);

      const grid = document.createElement('div');
      grid.className = 'grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6';

      (act.options || []).forEach((opt, idx) => {
        const card = document.createElement('div');
        card.className = 'duo-card rounded-2xl p-4 flex flex-col items-center justify-between cursor-pointer bg-white relative min-h-[180px]';
        card.id = `opt-card-${opt.id}`;
        card.onclick = () => selectMCQOption(opt.id, opt.audio);

        const img = document.createElement('img');
        img.src = opt.image || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1"/>';
        img.className = 'w-24 h-24 object-contain mb-3';

        const textGroup = document.createElement('div');
        textGroup.className = 'w-full flex flex-col items-center text-center pt-2 border-t border-gray-100';

        const tibText = document.createElement('span');
        tibText.className = 'tibetan-text text-xl font-bold text-gray-800';
        tibText.innerText = opt.tibetan || '';
        textGroup.appendChild(tibText);

        if (lessonData.settings.showPhonetics && opt.phonetics) {
          const phonText = document.createElement('span');
          phonText.className = 'text-base text-gray-500 font-bold';
          phonText.innerText = opt.phonetics;
          textGroup.appendChild(phonText);
        }

        if (lessonData.settings.showEnglish && opt.english) {
          const engText = document.createElement('span');
          engText.className = 'text-base text-gray-500 font-bold';
          engText.innerText = opt.english;
          textGroup.appendChild(engText);
        }

        const badge = document.createElement('span');
        badge.className = 'absolute bottom-3 right-3 w-6 h-6 rounded-lg border border-gray-300 text-gray-400 text-xs font-bold flex items-center justify-center';
        badge.innerText = idx + 1;

        card.appendChild(img);
        card.appendChild(textGroup);
        card.appendChild(badge);
        grid.appendChild(card);
      });

      container.appendChild(grid);
    }

    function selectMCQOption(optId, audioBase64) {
      selectedOptionId = optId;
      document.querySelectorAll('.duo-card').forEach(c => c.classList.remove('selected'));

      playSoundEffect('tap');
      document.getElementById('btn-check').disabled = false;

    }

    // --- LAYOUT 2: Sentence Reorder ---
    function renderReorderLayout(act, container) {

      container.appendChild(slotContainer);

      const wordBank = document.createElement('div');
      wordBank.id = 'word-bank';
      wordBank.className = 'flex flex-wrap justify-center gap-2.5';

      const displayWords = previewScrambledWordsMap[act.id] || (act.words || []);

      displayWords.forEach(w => {
        const tile = document.createElement('button');
        tile.id = `bank-tile-${w.id}`;

        const tibSpan = document.createElement('span');
        tibSpan.className = 'tibetan-text text-xl font-bold text-gray-800';
        tibSpan.innerText = w.tibetan || '';
        tile.appendChild(tibSpan);

    async function playFullSentenceAudioSequence(act) {
      if (!act || !act.words) return;
      const correctTarget = act.correctOrder || act.words.filter(w => !w.isDistractor).map(w => w.id);
      
      for (const id of correctTarget) {
        const w = act.words.find(item => item.id === id);
        if (w && w.audio) {
          await playAudioPromise(w.audio);
          await new Promise(r => setTimeout(r, 120));
        }
      }
    }

    function playAudioPromise(base64) {
      return new Promise((resolve) => {
        try {
          const audio = new Audio(base64);
          audio.onended = () => resolve();
          audio.onerror = () => resolve();
          audio.play().catch(() => resolve());
        } catch (e) {
          resolve();
        }
      });
    }

    function checkMatchingPairAttempt() {
      if (!selectedLeftMatchingId || !selectedRightMatchingId) return;

      const act = lessonData.activities[currentActivityIndex];
      const leftCard = document.getElementById(`match-left-${selectedLeftMatchingId}`);
      const rightCard = document.getElementById(`match-right-${selectedRightMatchingId}`);

      if (selectedLeftMatchingId === selectedRightMatchingId) {
        matchedPairIds.push(selectedLeftMatchingId);

        playSoundEffect('match_pair');

        if (leftCard) {
          leftCard.classList.remove('selected');
          leftCard.classList.add('matched');
        }
        if (rightCard) {
          rightCard.classList.remove('selected');
          rightCard.classList.add('matched');
        }

        selectedLeftMatchingId = null;
        selectedRightMatchingId = null;

        if (matchedPairIds.length === (act.pairs || []).length) {
          document.getElementById('btn-check').disabled = false;
        }
      } else {
        playSoundEffect('wrong');

        if (leftCard) leftCard.classList.add('wrong');
        if (rightCard) rightCard.classList.add('wrong');

        setTimeout(() => {
          if (leftCard && !matchedPairIds.includes(selectedLeftMatchingId)) {
            leftCard.classList.remove('selected', 'wrong');
          }
          if (rightCard && !matchedPairIds.includes(selectedRightMatchingId)) {
            rightCard.classList.remove('selected', 'wrong');
          }
          selectedLeftMatchingId = null;
          selectedRightMatchingId = null;
        }, 500);
      }
    }

    // --- CHECK LOGIC ---
    function handleCheck() {
      const act = lessonData.activities[currentActivityIndex];
      let isCorrect = false;

      if (act.type === 'mcq' || act.type === 'select_meaning') {
        const selected = act.options.find(o => o.id === selectedOptionId);
        isCorrect = selected && selected.isCorrect;
      } else if (act.type === 'reorder' || act.type === 'audio_reorder' || act.type === 'chat_complete') {
        const containsDistractor = selectedWordTileIds.some(id => {
          const w = (act.words || []).find(item => item.id === id);
          return w && w.isDistractor;
        });

        if (containsDistractor) {
          isCorrect = false;
        } else {
          const correctTarget = act.correctOrder || act.words.filter(w => !w.isDistractor).map(w => w.id);
          isCorrect = JSON.stringify(selectedWordTileIds) === JSON.stringify(correctTarget);
        }
      } else if (act.type === 'matching') {
        isCorrect = matchedPairIds.length === (act.pairs || []).length;
      }

      showFeedbackBanner(isCorrect);
    }

    function showFeedbackBanner(isCorrect) {
      isCurrentAnswerCorrect = isCorrect;

      // Play sound effect on check result
      playAnswerFeedbackSound(isCorrect);

      const banner = document.getElementById('feedback-banner');
      const icon = document.getElementById('feedback-icon');
      const title = document.getElementById('feedback-title');
      const detail = document.getElementById('feedback-detail');
      const bannerBtn = document.getElementById('feedback-next-btn');

      banner.classList.remove('hidden', 'bg-green-100', 'bg-red-100', 'text-green-900', 'text-red-900');

      if (isCorrect) {
        banner.classList.add('bg-green-100', 'text-green-900');
        icon.className = 'w-12 h-12 rounded-full flex items-center justify-center text-2xl font-bold bg-green-500 text-white';
        icon.innerHTML = `<i class="fa-solid fa-check"></i>`;
        title.innerText = 'Excellent!';
        detail.innerText = 'You got the correct answer.';
        bannerBtn.innerText = 'Continue';
        bannerBtn.className = 'px-8 py-3 rounded-2xl font-bold uppercase font-fredoka bg-green-500 hover:bg-green-600 text-white shadow-md';
        
        activityScores[lessonData.activities[currentActivityIndex].id] = 100;

        if (typeof confetti === 'function') {
          confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });

      } else {

    function moveActivity(fromIdx, direction) {
      const toIdx = fromIdx + direction;
      if (toIdx < 0 || toIdx >= lessonData.activities.length) return;

      const temp = lessonData.activities[fromIdx];
      lessonData.activities[fromIdx] = lessonData.activities[toIdx];
      lessonData.activities[toIdx] = temp;

      if (currentActivityIndex === fromIdx) {
        currentActivityIndex = toIdx;
      } else if (currentActivityIndex === toIdx) {
        currentActivityIndex = fromIdx;
      }

      populateTeacherActivityDropdown();
      renderCategorizedExerciseBrowser();
      renderCurrentActivity();
    }

      currentActivityIndex = parseInt(indexStr, 10);

        ];

    function deleteCurrentActivity() {
      if (lessonData.activities.length <= 1) {
        alert("At least one activity is required in the lesson.");
        return;
      }
      if (confirm("Are you sure you want to delete this activity?")) {
        lessonData.activities.splice(currentActivityIndex, 1);

          currentActivityIndex = lessonData.activities.length - 1;
        }
        populateTeacherActivityDropdown();
        renderCategorizedExerciseBrowser();
        renderCurrentActivity();

    function scrambleWords() {
      const act = lessonData.activities[currentActivityIndex];
      if (act && (act.type === 'reorder' || act.type === 'audio_reorder' || act.type === 'chat_complete') && act.words && act.words.length > 1) {
        const copy = [...act.words];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        previewScrambledWordsMap[act.id] = copy;
        renderCurrentActivity();
      }
    }

    function scrambleMatchingPairs() {
      const act = lessonData.activities[currentActivityIndex];
      if (act && act.type === 'matching' && act.pairs && act.pairs.length > 1) {
        const copy = [...act.pairs];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        previewScrambledMatchingMap[act.id] = copy;
        renderCurrentActivity();
      }
    }

    function downloadJsonBackup() {
      const dataToSave = JSON.parse(JSON.stringify(lessonData));
      dataToSave.scrambledWordsMap = previewScrambledWordsMap;
      dataToSave.scrambledMatchingMap = previewScrambledMatchingMap;

      const jsonStr = JSON.stringify(dataToSave, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'tibetan_lesson_backup.json';
      a.click();
    }

    function uploadJsonBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && Array.isArray(parsed.activities)) {
            lessonData = parsed;
            if (!lessonData.settings) {
              lessonData.settings = { showPhonetics: true, showEnglish: true };
            }
            previewScrambledWordsMap = parsed.scrambledWordsMap || {};
            previewScrambledMatchingMap = parsed.scrambledMatchingMap || {};

            syncStudentTogglesUI();
            currentActivityIndex = 0;
            populateTeacherActivityDropdown();
            renderCategorizedExerciseBrowser();
            renderCurrentActivity();
            alert("Backup JSON successfully imported!");
          } else {
            alert("Invalid lesson JSON format.");
          }
        } catch (err) {
          alert("Error reading JSON file.");
        }
      };
      reader.readAsText(file);
    }

                    <input type="checkbox" ${w.isDistractor ? 'checked' : ''} onchange="updateWordField(${idx}, 'isDistractor', this.checked)"> Distractor
                  </label>
                  <button onclick="deleteWordTile(${idx})" class="text-xs text-red-500 hover:text-red-700 font-bold">
                    <i class="fa-solid fa-trash"></i> Delete
                  </button>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-2">
                <input type="text" placeholder="Tibetan" value="${w.tibetan || ''}" onchange="updateWordField(${idx}, 'tibetan', this.value)" class="border rounded p-1 text-xs font-bold tibetan-text">
                <input type="text" placeholder="Phonetics" value="${w.phonetics || ''}" onchange="updateWordField(${idx}, 'phonetics', this.value)" class="border rounded p-1 text-xs">
                <input type="text" placeholder="English Meaning" value="${w.english || ''}" onchange="updateWordField(${idx}, 'english', this.value)" class="border rounded p-1 text-xs">
              </div>
              <div class="flex items-center space-x-2">
                ${isRec ? `
                  <button onclick="stopRecording()" class="text-xs bg-red-600 text-white px-3 py-1 rounded font-bold animate-pulse flex items-center gap-1">
                    <i class="fa-solid fa-square"></i> Stop & Save
                  </button>
                ` : `
                  <button onclick="toggleAudioRecording('word', ${idx})" class="text-xs bg-red-50 text-red-600 border border-red-200 px-2 py-1 rounded font-bold hover:bg-red-100 flex items-center gap-1">
                    <i class="fa-solid fa-microphone"></i> Record Pronunciation
                  </button>
                `}
                ${w.audio ? `
                  <button onclick="playAudioBase64('${w.audio}')" class="text-xs bg-blue-50 text-blue-600 border border-blue-200 px-2 py-1 rounded font-bold hover:bg-blue-100 flex items-center gap-1">
                    <i class="fa-solid fa-volume-high"></i> Play Preview
                  </button>
                ` : ''}
              </div>
            </div>
          `;
        });
      } else if (act.type === 'reorder' || act.type === 'audio_reorder') {
        const isAudioType = act.type === 'audio_reorder';
        html += `
          <div>
            <label class="block font-bold text-gray-700 text-xs uppercase mb-1">Activity Prompt Title</label>
            <input type="text" value="${act.promptTitle || ''}" onchange="updateActField('promptTitle', this.value)" class="w-full border rounded p-2 text-sm">
          </div>
          ${!isAudioType ? `
          <div>
            <label class="block font-bold text-gray-700 text-xs uppercase mb-1">English Prompt</label>
            <input type="text" value="${act.englishPrompt || ''}" onchange="updateActField('englishPrompt', this.value)" class="w-full border rounded p-2 text-sm">
          </div>
          ` : ''}
          <div class="flex items-center justify-between pt-2 border-t">
            <span class="font-bold text-xs uppercase text-gray-600">Word Bank Tiles (Exact Sentence Order)</span>
            <div class="flex items-center space-x-2">
              <button onclick="scrambleWords()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1 px-3 rounded-lg flex items-center gap-1">
                <i class="fa-solid fa-shuffle"></i> Scramble Student Preview
              </button>
              <button onclick="addWordTile()" class="text-xs bg-green-600 hover:bg-green-700 text-white font-bold py-1 px-3 rounded-lg flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> Add Tile
              </button>
            </div>
          </div>
        `;

        (act.words || []).forEach((w, idx) => {
          const isRec = recordingTarget && recordingTarget.type === 'word' && recordingTarget.idx === idx;
          html += `
            <div class="p-3 bg-gray-50 border rounded-xl space-y-2">
              <div class="flex items-center justify-between">
                <span class="font-bold text-xs text-gray-500">Tile ${idx + 1}</span>
                <div class="flex items-center space-x-3">
                  <label class="text-xs font-bold text-amber-700 flex items-center gap-1">
                    <input type="checkbox" ${w.isDistractor ? 'checked' : ''} onchange="updateWordField(${idx}, 'isDistractor', this.checked)"> Distractor
                  </label>
                  <button onclick="deleteWordTile(${idx})" class="text-xs text-red-500 hover:text-red-700 font-bold">
                    <i class="fa-solid fa-trash"></i> Delete
                  </button>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-2">
                <input type="text" placeholder="Tibetan" value="${w.tibetan || ''}" onchange="updateWordField(${idx}, 'tibetan', this.value)" class="border rounded p-1 text-xs font-bold tibetan-text">
                <input type="text" placeholder="Phonetics" value="${w.phonetics || ''}" onchange="updateWordField(${idx}, 'phonetics', this.value)" class="border rounded p-1 text-xs">
                <input type="text" placeholder="English Meaning" value="${w.english || ''}" onchange="updateWordField(${idx}, 'english', this.value)" class="border rounded p-1 text-xs">
              </div>
              <div class="flex items-center space-x-2">
                ${isRec ? `
                  <button onclick="stopRecording()" class="text-xs bg-red-600 text-white px-3 py-1 rounded font-bold animate-pulse flex items-center gap-1">
                    <i class="fa-solid fa-square"></i> Stop & Save
                  </button>
                ` : `
                  <button onclick="toggleAudioRecording('word', ${idx})" class="text-xs bg-red-50 text-red-600 border border-red-200 px-2 py-1 rounded font-bold hover:bg-red-100 flex items-center gap-1">
                    <i class="fa-solid fa-microphone"></i> Record Pronunciation
                  </button>
                `}
                ${w.audio ? `
                  <button onclick="playAudioBase64('${w.audio}')" class="text-xs bg-blue-50 text-blue-600 border border-blue-200 px-2 py-1 rounded font-bold hover:bg-blue-100 flex items-center gap-1">
                    <i class="fa-solid fa-volume-high"></i> Play Preview
                  </button>
                ` : ''}
              </div>
            </div>
          `;
        });
      } else if (act.type === 'matching') {
        html += `
          <div>
            <label class="block font-bold text-gray-700 text-xs uppercase mb-1">Activity Title</label>
            <input type="text" value="${act.title || ''}" onchange="updateActField('title', this.value)" class="w-full border rounded p-2 text-sm">
          </div>
          <div class="flex items-center justify-between pt-2 border-t">
            <span class="font-bold text-xs uppercase text-gray-600">Matching Pairs (Aligned side-by-side in Teacher Mode)</span>
            <div class="flex items-center space-x-2">
              <button onclick="scrambleMatchingPairs()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1 px-3 rounded-lg flex items-center gap-1">
                <i class="fa-solid fa-shuffle"></i> Scramble Pairs (Student Preview)
              </button>
              <button onclick="addMatchingPair()" class="text-xs bg-green-600 hover:bg-green-700 text-white font-bold py-1 px-3 rounded-lg flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> Add Pair
              </button>
            </div>
          </div>
        `;

        (act.pairs || []).forEach((p, idx) => {
          const isRec = recordingTarget && recordingTarget.type === 'pair' && recordingTarget.idx === idx;
          html += `
            <div class="p-3 bg-gray-50 border rounded-xl space-y-2">
              <div class="flex items-center justify-between">
                <span class="font-bold text-xs text-gray-500">Pair ${idx + 1}</span>
                <button onclick="deleteMatchingPair(${idx})" class="text-xs text-red-500 hover:text-red-700 font-bold">
                  <i class="fa-solid fa-trash"></i> Delete
                </button>
              </div>
              <div class="grid grid-cols-3 gap-2">
                <input type="text" placeholder="English Word" value="${p.english || ''}" onchange="updatePairField(${idx}, 'english', this.value)" class="border rounded p-1 text-xs font-bold">
                <input type="text" placeholder="Tibetan Script" value="${p.tibetan || ''}" onchange="updatePairField(${idx}, 'tibetan', this.value)" class="border rounded p-1 text-xs font-bold tibetan-text">
                <input type="text" placeholder="Phonetics" value="${p.phonetics || ''}" onchange="updatePairField(${idx}, 'phonetics', this.value)" class="border rounded p-1 text-xs">
              </div>
              <div class="flex items-center space-x-2">
                ${isRec ? `
                  <button onclick="stopRecording()" class="text-xs bg-red-600 text-white px-3 py-1 rounded font-bold animate-pulse flex items-center gap-1">
                    <i class="fa-solid fa-square"></i> Stop & Save
                  </button>
                ` : `
                  <button onclick="toggleAudioRecording('pair', ${idx})" class="text-xs bg-red-50 text-red-600 border border-red-200 px-2 py-1 rounded font-bold hover:bg-red-100 flex items-center gap-1">
                    <i class="fa-solid fa-microphone"></i> Rec Pronunciation
                  </button>
                `}
                ${p.audio ? `
                  <button onclick="playAudioBase64('${p.audio}')" class="text-xs bg-blue-50 text-blue-600 border border-blue-200 px-2 py-1 rounded font-bold hover:bg-blue-100 flex items-center gap-1">
                    <i class="fa-solid fa-volume-high"></i> Play Preview
                  </button>
                ` : ''}
              </div>
            </div>
          `;
        });
      }

      html += `</div>`;
      editor.innerHTML = html;
    }

    function updateActField(field, val) {
      lessonData.activities[currentActivityIndex][field] = val;
      renderCategorizedExerciseBrowser();
      renderCurrentActivity();
    }

    function updateMCQOpt(idx, field, val) {
      lessonData.activities[currentActivityIndex].options[idx][field] = val;
      renderCategorizedExerciseBrowser();
      renderCurrentActivity();
    }

    function setCorrectMCQOption(correctIdx) {
      lessonData.activities[currentActivityIndex].options.forEach((opt, idx) => {
        opt.isCorrect = (idx === correctIdx);
      });
      renderCurrentActivity();
    }

    function updateWordField(idx, field, val) {
      const act = lessonData.activities[currentActivityIndex];
      act.words[idx][field] = val;

      if (field === 'isDistractor') {
        const wordId = act.words[idx].id;
        if (val) {
          act.correctOrder = (act.correctOrder || []).filter(id => id !== wordId);
        } else {
          if (!act.correctOrder) act.correctOrder = [];
          if (!act.correctOrder.includes(wordId)) act.correctOrder.push(wordId);
        }
      }

      renderCategorizedExerciseBrowser();
      renderCurrentActivity();
    }

    function updatePairField(idx, field, val) {
      lessonData.activities[currentActivityIndex].pairs[idx][field] = val;
      renderCategorizedExerciseBrowser();
      renderCurrentActivity();
    }

    async function toggleAudioRecording(type, idx) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        recordingTarget = { type, idx };

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(blob);
          reader.onloadend = () => {
            const base64Audio = reader.result;
            const act = lessonData.activities[currentActivityIndex];
            if (recordingTarget.type === 'word') {
              act.words[recordingTarget.idx].audio = base64Audio;
            } else if (recordingTarget.type === 'mcq' || recordingTarget.type === 'meaning') {
              act.options[recordingTarget.idx].audio = base64Audio;
            } else if (recordingTarget.type === 'pair') {
              act.pairs[recordingTarget.idx].audio = base64Audio;
            } else if (recordingTarget.type === 'chat_q') {
              act.questionAudio = base64Audio;
            }
            recordingTarget = null;
            renderCurrentActivity();
          };
        };

        mediaRecorder.start();
        updateTeacherEditor();
      } catch (err) {
        alert("Microphone access denied or unavailable.");
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
    }

    function downloadStudentVersion() {
      const docClone = document.cloneNode(true);

      const dataToSave = JSON.parse(JSON.stringify(lessonData));
      dataToSave.scrambledWordsMap = previewScrambledWordsMap;
      dataToSave.scrambledMatchingMap = previewScrambledMatchingMap;

      const datasetTag = docClone.getElementById('lesson-dataset');
      if (datasetTag) {
        datasetTag.textContent = JSON.stringify(dataToSave, null, 2);
      }

      const teacherPanel = docClone.getElementById('teacher-panel');
      if (teacherPanel) teacherPanel.remove();

      const toggleBtn = docClone.getElementById('btn-toggle-teacher');
      if (toggleBtn) toggleBtn.remove();

      const addModal = docClone.getElementById('modal-add-activity');
      if (addModal) addModal.remove();

      const htmlContent = "<!DOCTYPE html>\n" + docClone.documentElement.outerHTML;

      const blob = new Blob([htmlContent], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'tibetan_lesson_student.html';
      a.click();
    }
  </script>
