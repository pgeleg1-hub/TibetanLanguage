    function scrambleWords() {
      const act = lessonData.activities[currentActivityIndex];
      if (act && act.type === 'reorder' && Array.isArray(act.words)) {
        const shuffledWords = [...act.words];
        for (let i = shuffledWords.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffledWords[i], shuffledWords[j]] = [shuffledWords[j], shuffledWords[i]];
        }
        if (shuffledWords.length > 1 && shuffledWords.every((word, index) => word.id === act.words[index].id)) {
          [shuffledWords[0], shuffledWords[1]] = [shuffledWords[1], shuffledWords[0]];
        }
        previewScrambledWordsMap[act.id] = shuffledWords;
        renderCurrentActivity();
      } else if (act && (act.type === 'audio_reorder' || act.type === 'chat_complete' || act.type === 'test' || act.type === 'test_sentence') && (act.words || act.items)) {

        delete previewScrambledWordsMap[act.id];
        renderCurrentActivity();
      }
    }

    function scrambleMatchingPairs() {
      const act = lessonData.activities[currentActivityIndex];
      if (act && (act.type === 'matching' || act.type === 'matching_tib') && act.pairs && act.pairs.length > 1) {
        const copy = [...act.pairs];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        previewScrambledMatchingMap[act.id] = copy;
        renderCurrentActivity();
      }
    }

    function scrambleQATibSentence(pIdx, side, sIdx) {
      const act = lessonData.activities[currentActivityIndex];
      if (!act || act.type !== 'qa_tib' || !act.pairs || !act.pairs[pIdx]) return;
      normalizeQATibPair(act.pairs[pIdx]);
      const listKey = side === 'question' ? 'questions' : 'answers';
      const sent = act.pairs[pIdx][listKey] && act.pairs[pIdx][listKey][sIdx];
      if (!sent || !Array.isArray(sent.words) || sent.words.length < 2) {
        alert('Need at least 2 words to scramble.');
        return;
      }
      const mapKey = `${act.id}_${pIdx}_${side === 'question' ? 'q' : 'a'}_${sIdx}`;
      const shuffled = [...sent.words];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      // Ensure order actually changed when possible
      if (shuffled.length > 1 && shuffled.every((w, i) => w.id === sent.words[i].id)) {
        [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
      }
      previewScrambledQATibMap[mapKey] = shuffled;
      renderCurrentActivity();
    }

    function downloadJsonBackup() {
      const dataToSave = JSON.parse(JSON.stringify(lessonData));
      dataToSave.scrambledWordsMap = previewScrambledWordsMap;
      dataToSave.scrambledMatchingMap = previewScrambledMatchingMap;
      dataToSave.scrambledQATibMap = previewScrambledQATibMap;

      const jsonStr = JSON.stringify(dataToSave, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'tibetan_lesson_backup.json';
      a.click();
    }

    function uploadJsonBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && Array.isArray(parsed.activities)) {
            lessonData = parsed;
            if (!lessonData.settings) {
              lessonData.settings = { showPhonetics: true, showEnglish: true, playAudio: true, completionTitle: "Lesson Completed!", completionSubtitle: "Tashi Delek! You have completed all activities in this lesson.", completionBtnText: "Practice Again" };
            }
            if (lessonData.settings.playAudio === undefined) lessonData.settings.playAudio = true;
            if (!lessonData.settings.completionTitle) lessonData.settings.completionTitle = "Lesson Completed!";
            if (!lessonData.settings.completionSubtitle) lessonData.settings.completionSubtitle = "Tashi Delek! You have completed all activities in this lesson.";
            if (!lessonData.settings.completionBtnText) lessonData.settings.completionBtnText = "Practice Again";

            if (!lessonData.wordBankCategories) {
              lessonData.wordBankCategories = ["Drinks", "Greetings", "Polite Words"];
            }
            if (!lessonData.wordBank) {
              lessonData.wordBank = [];
            }
            if (!lessonData.sentenceBank) {
              lessonData.sentenceBank = [];
            }
            if (!lessonData.sentenceBankCategories) {
              lessonData.sentenceBankCategories = [];
            }
            previewScrambledWordsMap = parsed.scrambledWordsMap || {};
            previewScrambledMatchingMap = parsed.scrambledMatchingMap || {};
            previewScrambledQATibMap = parsed.scrambledQATibMap || {};

            syncStudentTogglesUI();
            currentActivityIndex = 0;
            maxReachedIndex = 0;
            activityScores = {};
            activityAnswerState = {};
            syncCompletionSettingsUI();
            renderWordBankManager();
            renderSentenceBankManager();

            populateTeacherActivityDropdown();
            renderCategorizedExerciseBrowser();
            renderCurrentActivity();
            alert("Backup JSON successfully imported!");


          } else {
            alert("Invalid lesson JSON format.");
          }
        } catch (err) {
          alert("Error reading JSON file.");
        }
      };
      reader.readAsText(file);
    }

    function deleteAudio(type, idx, rIdx, cIdx, side) {

        updateTeacherEditor();
        return;
      }

      if (!act) return;

      if (type === 'tile' && act.rows && act.rows[rIdx] && act.rows[rIdx][cIdx]) {
        act.rows[rIdx][cIdx].audio = '';
      } else if (type === 'word' && act.words && act.words[idx]) {
        act.words[idx].audio = '';
      } else if ((type === 'mcq' || type === 'meaning' || type === 'meaning_tib') && act.options && act.options[idx]) {
        act.options[idx].audio = '';
      } else if (type === 'pair' && act.pairs && act.pairs[idx]) {
        act.pairs[idx].audio = '';
      } else if (type === 'mtib_word' && act.pairs && act.pairs[idx] && act.pairs[idx][side]) {
        act.pairs[idx][side].audio = '';
      } else if (type === 'chat_q') {
        act.questionAudio = '';
      } else if (type === 'test_item' && act.items && act.items[idx]) {
        act.items[idx].audio = '';
      } else if (type === 'qa_word' && act.pairs && act.pairs[rIdx] && act.pairs[rIdx][side] && act.pairs[rIdx][side][idx]) {
        act.pairs[rIdx][side][idx].audio = '';
      } else if (type === 'qatib_word' && act.pairs && act.pairs[rIdx]) {
        normalizeQATibPair(act.pairs[rIdx]);
        const listKey = side === 'question' ? 'questions' : 'answers';
        const sIdx = cIdx;
        const sent = act.pairs[rIdx][listKey] && act.pairs[rIdx][listKey][sIdx];

          sent.words[idx].audio = '';
        }

        act.targetWords[idx].audio = '';
      } else if (type === 'sst_opt' && act.options && act.options[idx]) {
        act.options[idx].audio = '';
      }

      renderCurrentActivity();
    }

    function saveIntroQASideToBank(pIdx, side) {
      const act = lessonData.activities[currentActivityIndex];
      if (!act || !act.introQAPairs || !act.introQAPairs[pIdx]) return;
      const pair = act.introQAPairs[pIdx];
      const rowWords = pair[side] || [];
      if (!rowWords.length) {
        alert('No word boxes to save.');
        return;
      }
      if (!lessonData.sentenceBank) lessonData.sentenceBank = [];
      const words = rowWords.map(w => ({
        id: 'sbw_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
        tibetan: w.tibetan || '',
        phonetics: w.phonetics || '',
        english: w.english || '',
        audio: w.audio || ''
      }));
      const tibKey = words.map(w => (w.tibetan || '').trim()).filter(Boolean).join(' ');
      if (!tibKey) {
        alert('Add Tibetan text before saving.');
        return;
      }
      const isDup = lessonData.sentenceBank.some(s =>
        (s.words || []).map(w => (w.tibetan || '').trim()).filter(Boolean).join(' ') === tibKey
      );
      if (isDup) {
        alert('This Tibetan sentence is already in the Sentence Bank.');
        return;
      }
      const isQSide = (side === 'question' || side === 'question2');
      const engKey = side === 'question' ? 'questionEnglish' : side === 'question2' ? 'questionEnglish2' : side === 'answer2' ? 'answerEnglish2' : 'answerEnglish';
      const englishMeaning = (pair[engKey] || '').trim() || words.map(w => w.english).filter(Boolean).join(' ');
      const phonetics = words.map(w => w.phonetics).filter(Boolean).join(' · ');
      lessonData.sentenceBank.push({
        id: 'sb_' + Date.now().toString(36),
        words: words,
        phonetics: phonetics,
        englishMeaning: englishMeaning,
        category: isQSide ? 'Intro Q&A — Question' : 'Intro Q&A — Answer'
      });
      renderSentenceBankManager();
      playSoundEffect('correct');
      alert((isQSide ? 'Question' : 'Answer') + ' sentence saved to Sentence Bank!');
    }

    function importSentenceBankToQATibSentence(pIdx, side, sIdx, sbIdxStr) {
      if (sbIdxStr === '' || sbIdxStr === null || sbIdxStr === undefined) return;
      const sbIdx = parseInt(sbIdxStr, 10);
      const s = lessonData.sentenceBank && lessonData.sentenceBank[sbIdx];
      const act = lessonData.activities[currentActivityIndex];
      if (!s || !act || !act.pairs || !act.pairs[pIdx]) return;
      normalizeQATibPair(act.pairs[pIdx]);
      const listKey = side === 'question' ? 'questions' : 'answers';
      const sent = act.pairs[pIdx][listKey] && act.pairs[pIdx][listKey][sIdx];
      if (!sent) return;
      const words = (s.words || []).map((w, i) => ({
        id: (side === 'question' ? 'qtw_' : 'atw_') + Date.now().toString(36) + '_' + i,
        tibetan: w.tibetan || '',
        phonetics: w.phonetics || '',
        english: w.english || '',
        audio: w.audio || '',
        isDistractor: false
      }));
      if (!words.length) {
        alert('That Sentence Bank entry has no words.');
        return;
      }
      sent.words = words;
      sent.correctOrder = words.map(w => w.id);
      // Clear any previous scramble for this sentence
      if (act.id) {
        const mapKey = `${act.id}_${pIdx}_${side === 'question' ? 'q' : 'a'}_${sIdx}`;

    function saveQATibSentenceToBank(pIdx, side, sIdx) {
      const act = lessonData.activities[currentActivityIndex];
      if (!act || !act.pairs || !act.pairs[pIdx]) return;
      normalizeQATibPair(act.pairs[pIdx]);
      const listKey = side === 'question' ? 'questions' : 'answers';
      const sent = act.pairs[pIdx][listKey] && act.pairs[pIdx][listKey][sIdx];
      if (!sent) return;
      const rowWords = sent.words || [];
      if (!rowWords.length) {
        alert('This sentence has no word boxes to save.');
        return;
      }
      if (!lessonData.sentenceBank) lessonData.sentenceBank = [];
      const words = rowWords.map(w => ({
        id: 'sbw_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
        tibetan: w.tibetan || '',
        phonetics: w.phonetics || '',
        english: w.english || '',
        audio: w.audio || ''
      }));
      const phonetics = words.map(w => w.phonetics).filter(Boolean).join(' · ');
      const englishMeaning = words.map(w => w.english).filter(Boolean).join(' ');
      const tibKey = words.map(w => (w.tibetan || '').trim()).filter(Boolean).join(' ');
      if (!tibKey) {
        alert('Add Tibetan text before saving to the Sentence Bank.');
        return;
      }
      const isDup = lessonData.sentenceBank.some(s =>
        (s.words || []).map(w => (w.tibetan || '').trim()).filter(Boolean).join(' ') === tibKey
      );
      if (isDup) {
        alert('This Tibetan sentence is already in the Sentence Bank.');
        return;
      }
      lessonData.sentenceBank.push({
        id: 'sb_' + Date.now().toString(36),
        words: words,
        phonetics: phonetics,
        englishMeaning: englishMeaning,
        category: ''
      });
      renderSentenceBankManager();
      if (typeof updateTeacherEditor === 'function') updateTeacherEditor();
      playSoundEffect('correct');
      alert((side === 'question' ? 'Question' : 'Answer') + ' sentence saved to Sentence Bank!');
    }

        if (el.closest('#lesson-container') && !el.closest('#teacher-panel') && !el.isContentEditable) {
          el.innerHTML = act.description || '';
        }
      });
    }

    function formatIntroDescription(command) {
      const descEd = document.getElementById('desc-editor');
      if (!descEd) return;
      descEd.focus();
      try {
        document.execCommand(command, false, null);
      } catch (e) {}
      syncIntroDescriptionFromEditor();
    }

    function formatIntroDescriptionColor(color) {
      const descEd = document.getElementById('desc-editor');
      if (!descEd) return;
      descEd.focus();
      try {
        document.execCommand('styleWithCSS', false, true);
        document.execCommand('foreColor', false, color);
      } catch (e) {}
      syncIntroDescriptionFromEditor();
    }

    function formatIntroDescriptionFontSize(delta) {
      const descEd = document.getElementById('desc-editor');
      if (!descEd) return;
      descEd.focus();
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);

      // If nothing selected, expand to the character at the caret so single-letter sizing works
      if (range.collapsed) {
        try {
          if (range.startContainer.nodeType === Node.TEXT_NODE) {
            const t = range.startContainer;
            const off = range.startOffset;
            if (off < t.length) {
              range.setEnd(t, off + 1);
            } else if (off > 0) {
              range.setStart(t, off - 1);
            }
          }
        } catch (e) {}
      }
      if (range.collapsed) return;

      const fragment = range.extractContents();
      const span = document.createElement('span');
      let currentPx = 14;
      try {
        const probe = range.startContainer.nodeType === Node.TEXT_NODE
          ? range.startContainer.parentElement
          : range.startContainer;
        if (probe && probe.nodeType === 1) {
          const cs = window.getComputedStyle(probe);
          currentPx = parseFloat(cs.fontSize) || 14;
        }
      } catch (e) {}
      const nextPx = Math.max(10, Math.min(48, Math.round(currentPx + delta * 2)));
      span.style.fontSize = nextPx + 'px';
      span.appendChild(fragment);
      range.insertNode(span);
      sel.removeAllRanges();
      const newRange = document.createRange();
      newRange.selectNodeContents(span);
      sel.addRange(newRange);
      syncIntroDescriptionFromEditor();
    }


    function updateActField(field, val) {
      lessonData.activities[currentActivityIndex][field] = val;
      renderCategorizedExerciseBrowser();
      renderCurrentActivity();
    }

    function updateMCQOpt(idx, field, val) {
      lessonData.activities[currentActivityIndex].options[idx][field] = val;
      renderCategorizedExerciseBrowser();
      renderCurrentActivity();
    }

    function setCorrectMCQOption(correctIdx) {
      lessonData.activities[currentActivityIndex].options.forEach((opt, idx) => {
        opt.isCorrect = (idx === correctIdx);
      });
      renderCurrentActivity();
    }

    function updateWordField(idx, field, val) {
      const act = lessonData.activities[currentActivityIndex];
      act.words[idx][field] = val;

      if (field === 'isDistractor') {
        const wordId = act.words[idx].id;
        if (val) {
          act.correctOrder = (act.correctOrder || []).filter(id => id !== wordId);
          act.words[idx].isPrefill = false;
        } else {
          if (!act.correctOrder) act.correctOrder = [];
          if (!act.correctOrder.includes(wordId)) act.correctOrder.push(wordId);
        }
      }

      if (field === 'isPrefill') {
        const wordId = act.words[idx].id;
        if (val) {
          act.words[idx].isDistractor = false;
          if (!act.correctOrder) act.correctOrder = [];
          if (!act.correctOrder.includes(wordId)) act.correctOrder.push(wordId);
        }
      }

      renderCategorizedExerciseBrowser();
      renderCurrentActivity();
    }

    function updatePairField(idx, field, val) {
      lessonData.activities[currentActivityIndex].pairs[idx][field] = val;
      renderCategorizedExerciseBrowser();
      renderCurrentActivity();
    }

    async function toggleAudioRecording(type, idx, rIdx, cIdx, side) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        recordingTarget = { type, idx, rIdx, cIdx, side, pIdx: rIdx, wIdx: idx };

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(blob);
          reader.onloadend = () => {
            const base64Audio = reader.result;
            const act = lessonData.activities[currentActivityIndex];

            if (recordingTarget.type === 'wordbank' && lessonData.wordBank && lessonData.wordBank[recordingTarget.idx]) {
              lessonData.wordBank[recordingTarget.idx].audio = base64Audio;
              recordingTarget = null;
              renderWordBankManager();
              updateTeacherEditor();
              return;
            }

            if (recordingTarget.type === 'tile' && act.rows && act.rows[recordingTarget.rIdx] && act.rows[recordingTarget.rIdx][recordingTarget.cIdx]) {
              act.rows[recordingTarget.rIdx][recordingTarget.cIdx].audio = base64Audio;
            } else if (recordingTarget.type === 'word') {
              act.words[recordingTarget.idx].audio = base64Audio;
            } else if (recordingTarget.type === 'mcq' || recordingTarget.type === 'meaning' || recordingTarget.type === 'meaning_tib') {
              act.options[recordingTarget.idx].audio = base64Audio;
            } else if (recordingTarget.type === 'pair') {
              act.pairs[recordingTarget.idx].audio = base64Audio;
            } else if (recordingTarget.type === 'mtib_word' && act.pairs && act.pairs[recordingTarget.idx] && act.pairs[recordingTarget.idx][recordingTarget.side]) {
              act.pairs[recordingTarget.idx][recordingTarget.side].audio = base64Audio;
            } else if (recordingTarget.type === 'chat_q') {
              act.questionAudio = base64Audio;
            } else if (recordingTarget.type === 'test_item' && act.items && act.items[recordingTarget.idx]) {
              act.items[recordingTarget.idx].audio = base64Audio;
            } else if (recordingTarget.type === 'qa_word' && act.pairs && act.pairs[recordingTarget.pIdx] && act.pairs[recordingTarget.pIdx][recordingTarget.side] && act.pairs[recordingTarget.pIdx][recordingTarget.side][recordingTarget.wIdx]) {
              act.pairs[recordingTarget.pIdx][recordingTarget.side][recordingTarget.wIdx].audio = base64Audio;
            } else if (recordingTarget.type === 'qatib_word' && act.pairs && act.pairs[recordingTarget.pIdx]) {
              normalizeQATibPair(act.pairs[recordingTarget.pIdx]);
              const listKey = recordingTarget.side === 'question' ? 'questions' : 'answers';
              const sIdx = recordingTarget.cIdx;
              const sent = act.pairs[recordingTarget.pIdx][listKey] && act.pairs[recordingTarget.pIdx][listKey][sIdx];
              if (sent && sent.words && sent.words[recordingTarget.wIdx]) {
                sent.words[recordingTarget.wIdx].audio = base64Audio;
              }
            } else if (recordingTarget.type === 'sst_word' && act.targetWords && act.targetWords[recordingTarget.idx]) {
              act.targetWords[recordingTarget.idx].audio = base64Audio;
            } else if (recordingTarget.type === 'sst_opt' && act.options && act.options[recordingTarget.idx]) {
              act.options[recordingTarget.idx].audio = base64Audio;
            }
            recordingTarget = null;
            renderCurrentActivity();

          };
        };

        mediaRecorder.start();
        if (type === 'wordbank') {
          renderWordBankManager();
        } else {
          updateTeacherEditor();
        }
      } catch (err) {
        alert("Microphone access denied or unavailable.");
      }
    }


    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
    }

    function downloadStudentVersion() {
      const docClone = document.cloneNode(true);

      const dataToSave = JSON.parse(JSON.stringify(lessonData));
      delete dataToSave.wordBank;
      delete dataToSave.wordBankCategories;
      delete dataToSave.sentenceBank;
      delete dataToSave.sentenceBankCategories;


      dataToSave.scrambledWordsMap = previewScrambledWordsMap;
      dataToSave.scrambledMatchingMap = previewScrambledMatchingMap;
      dataToSave.scrambledQATibMap = previewScrambledQATibMap;

      const datasetTag = docClone.getElementById('lesson-dataset');
      if (datasetTag) {
        datasetTag.textContent = JSON.stringify(dataToSave, null, 2);
      }

      const teacherPanel = docClone.getElementById('teacher-panel');
      if (teacherPanel) teacherPanel.remove();

      const toggleBtn = docClone.getElementById('btn-toggle-teacher');
      if (toggleBtn) toggleBtn.remove();

      const addModal = docClone.getElementById('modal-add-activity');
      if (addModal) addModal.remove();

      const catModal = docClone.getElementById('modal-manage-categories');
      if (catModal) catModal.remove();

      const sbCatModal = docClone.getElementById('modal-manage-sentence-categories');
      if (sbCatModal) sbCatModal.remove();


      const htmlContent = "<!DOCTYPE html>\n" + docClone.documentElement.outerHTML;

      const blob = new Blob([htmlContent], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'tibetan_lesson_student.html';
      a.click();
    }
  </script>
