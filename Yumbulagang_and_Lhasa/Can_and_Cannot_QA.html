<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tibetan Sunday School Interactive Lesson</title>

  <!-- Allowed External Resources -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&amp;family=Fredoka:wght@400;600;700&amp;family=Noto+Serif+Tibetan:wght@400;600;700;900&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #f7f9fa;
      color: #3c3c3c;
      user-select: none;
      -webkit-user-select: none;
    }
    .tibetan-text {
      font-family: 'Noto Serif Tibetan', serif;
      line-height: 1.8;
    }
    /* Balanced font size for Tibetan inputs inside Teacher Mode Editor */
    #editor-content input.tibetan-text, #teacher-word-bank input.tibetan-text, #editor-content textarea.tibetan-text {
      font-size: 1.25rem !important; /* Enhanced readability for Tibetan script */
      line-height: 1.8;
    }
    .font-fredoka {
      font-family: 'Fredoka', sans-serif;
    }
    /* Introduction description: English uses Fredoka (same as other activities); Tibetan falls back to Noto Serif Tibetan */
    .intro-description {
      font-family: 'Fredoka', 'Noto Serif Tibetan', sans-serif;
      line-height: 1.8;
    }

    /* Duolingo-style custom UI elements */
    .duo-card {
      border: 2px solid #e5e5e5;
      border-bottom-width: 4px;
      transition: all 0.15s ease-in-out;
    }
    .duo-card:hover:not(.disabled):not(.matched) {
      border-color: #cecece;
      background-color: #f7f7f7;
    }
    .duo-card.selected {
      border-color: #84d8ff;
      background-color: #ddf4ff;
      color: #1cb0f6;
    }
    .duo-card.matched {
      border-color: #e5e5e5;
      background-color: #f3f4f6;
      color: #9ca3af !important;
      opacity: 0.5;
      cursor: default;
      pointer-events: none;
      border-bottom-width: 2px;
    }
    .duo-card.wrong {
      border-color: #fcd34d;
      background-color: #fffbe3;
      color: #b45309;
    }

    /* Matching Pairs TIB flip cards */
    .match-tib-card {
      perspective: 800px;
      min-height: 64px;
      width: 100%;
    }
    /* Allow tap-to-flip after a correct match (global .duo-card.matched sets pointer-events:none) */
    .match-tib-card.matched {
      pointer-events: auto;
      cursor: pointer;
      opacity: 0.85;
    }
    .match-tib-inner {
      position: relative;
      width: 100%;
      min-height: 64px;
      transition: transform 0.45s ease;
      transform-style: preserve-3d;
    }
    .match-tib-card.is-flipped .match-tib-inner {
      transform: rotateY(180deg);
    }
    /* Front face stays in flow so the card gets real width/height from Tibetan text */
    .match-tib-face {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 14px;
      padding: 0.75rem 0.5rem;
      width: 100%;
      box-sizing: border-box;
    }
    .match-tib-face.front {
      position: relative;
    }
    .match-tib-face.back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
    }

    .duo-tile {
      border: 2px solid #e5e5e5;
      border-bottom-width: 4px;
      background-color: #ffffff;
      transition: all 0.12s ease;
      cursor: pointer;
    }
    .duo-tile:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .duo-tile.used {
      background-color: #e5e5e5;
      border-color: #cecece;
      color: transparent !important;
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }

    .duo-btn-green {
      background-color: #58cc02;
      border-bottom: 4px solid #46a302;
      color: white;
    }
    .duo-btn-green:hover:not(:disabled) {
      background-color: #61e002;
    }
    .duo-btn-green:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .duo-btn-green:disabled {
      background-color: #e5e5e5;
      border-color: #cecece;
      color: #afafaf;
    }

    .speech-bubble {
      position: relative;
      background: #ffffff;
      border: 2px solid #e5e5e5;
      border-radius: 16px;
    }
    .speech-bubble::before {
      content: '';
      position: absolute;
      left: -12px;
      top: 50%;
      transform: translateY(-50%);
      border-style: solid;
      border-width: 10px 12px 10px 0;
      border-color: transparent #e5e5e5 transparent transparent;
      display: block;
      width: 0;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      left: -9px;
      top: 50%;
      transform: translateY(-50%);
      border-style: solid;
      border-width: 8px 10px 8px 0;
      border-color: transparent #ffffff transparent transparent;
      display: block;
      width: 0;
    }

    /* Right-pointing speech bubble for chat response character */
    .speech-bubble-right {
      position: relative;
      background: #ffffff;
      border-radius: 16px;
    }
    .speech-bubble-right::before {
      content: '';
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translateY(-50%);
      border-style: solid;
      border-width: 10px 0 10px 12px;
      border-color: transparent transparent transparent #7dd3fc;
      display: block;
      width: 0;
    }
    .speech-bubble-right::after {
      content: '';
      position: absolute;
      right: -9px;
      top: 50%;
      transform: translateY(-50%);
      border-style: solid;
      border-width: 8px 0 8px 10px;
      border-color: transparent transparent transparent #ffffff;
      display: block;
      width: 0;
    }

    /* Slot divider line */
    .slot-container {
      border-top: 2px solid #e5e5e5;
      border-bottom: 2px solid #e5e5e5;
      min-height: 80px;
    }

    /* Test Slot Styles */
    .test-blank-slot {
      border: 2px dashed #93c5fd;
      background-color: #eff6ff;
      transition: all 0.2s ease;
    }
    .test-blank-slot.drag-over {
      border-color: #3b82f6;
      background-color: #dbeafe;
      transform: scale(1.02);
    }
    .test-blank-slot.filled {
      border-style: solid;
      border-color: #60a5fa;
      background-color: #ffffff;
    }
    .test-blank-slot.active-tap-target {
      border-color: #f59e0b;
      background-color: #fef3c7;
      animation: pulse 1.5s infinite;
    }
  </style>

    // --- AUDIO SOUND EFFECTS ENGINE (Comfortable Tones & Interaction Feedback) ---
    async function playSoundEffect(type) {
      // Start/resume the audio engine from the user's click before scheduling notes.
      try {
        if (typeof Tone !== 'undefined') {
          await Tone.start();
          if (Tone.context && Tone.context.state !== 'running') {
            await Tone.context.resume();
          }

          const synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.01, decay: 0.15, sustain: 0.1, release: 0.2 }
          }).toDestination();
          const now = Tone.now();

          if (type === 'correct') {
            synth.triggerAttackRelease("F4", "8n", now, 0.25);
            synth.triggerAttackRelease("C5", "6n", now + 0.1, 0.3);
          } else if (type === 'wrong') {
            synth.triggerAttackRelease("G2", "8n", now, 0.25);
            synth.triggerAttackRelease("E2", "8n", now + 0.12, 0.2);
          } else if (type === 'match_pair') {
            synth.triggerAttackRelease("A4", "16n", now, 0.2);
            synth.triggerAttackRelease("E5", "16n", now + 0.08, 0.25);
          } else if (type === 'tap') {
            synth.triggerAttackRelease("C4", "32n", now, 0.15);
          }
          return;
        }
      } catch (e) {
        console.warn("Tone sound effect error; using Web Audio fallback", e);
      }

      // Native Web Audio fallback also resumes suspended contexts before playback.
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') await ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.frequency.setValueAtTime(349.23, ctx.currentTime);
          osc.frequency.setValueAtTime(523.25, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.35);
        } else if (type === 'wrong') {
          osc.frequency.setValueAtTime(98.00, ctx.currentTime);
          osc.frequency.setValueAtTime(82.41, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.35);
        } else if (type === 'match_pair') {
          osc.frequency.setValueAtTime(440.00, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'tap') {
          osc.frequency.setValueAtTime(261.63, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.08);
        } else {
          await ctx.close();
          return;
        }
        osc.onended = () => ctx.close();
      } catch (e) {
        console.warn("Sound effect error", e);
      }
    }

    function playAnswerFeedbackSound(isCorrect) {
      playSoundEffect(isCorrect ? 'correct' : 'wrong');
    }

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const rawJson = document.getElementById('lesson-dataset').textContent;
        const parsed = JSON.parse(rawJson);
        lessonData = parsed;
        if (!lessonData.settings) {
          lessonData.settings = { showPhonetics: true, showEnglish: true, playAudio: true, completionTitle: "Lesson Completed!", completionSubtitle: "Tashi Delek! You have completed all activities in this lesson.", completionBtnText: "Practice Again" };

        if (lessonData.settings.playAudio === undefined) lessonData.settings.playAudio = true;
        if (!lessonData.settings.completionTitle) lessonData.settings.completionTitle = "Lesson Completed!";
        if (!lessonData.settings.completionSubtitle) lessonData.settings.completionSubtitle = "Tashi Delek! You have completed all activities in this lesson.";
        if (!lessonData.settings.completionBtnText) lessonData.settings.completionBtnText = "Practice Again";

        if (!lessonData.wordBankCategories) {
          lessonData.wordBankCategories = ["Drinks", "Greetings", "Polite Words"];

          previewScrambledQATibMap = parsed.scrambledQATibMap;

      window.parent.postMessage(
        Object.assign({ source: "tss-lesson", type: type }, data || {}), "*"

      const phonToggle = document.getElementById('toggle-phonetics-student');
      const engToggle = document.getElementById('toggle-english-student');
      const audToggle = document.getElementById('toggle-audio-student');
      if (phonToggle) phonToggle.checked = lessonData.settings.showPhonetics !== false;
      if (engToggle) engToggle.checked = lessonData.settings.showEnglish !== false;
      if (audToggle) audToggle.checked = lessonData.settings.playAudio !== false;
    }

    // --- RENDER MAIN ENGINE ---
    function renderCurrentActivity() {
      const container = document.getElementById('lesson-container');
      const footer = document.getElementById('lesson-footer');
      container.innerHTML = '';
      resetFeedbackBanner();
      isCurrentAnswerCorrect = false;

      if (footer) footer.classList.remove('hidden');

      if (currentActivityIndex >= lessonData.activities.length) {
        renderLessonCompletion();
        return;
      }

      const act = lessonData.activities[currentActivityIndex];
      document.getElementById('activity-counter').innerText = `${currentActivityIndex + 1} / ${lessonData.activities.length}`;

      if (act.type === 'introduction') {
        renderIntroductionLayout(act, container);
      } else if (act.type === 'tiles') {
        renderTilesLayout(act, container);
      } else if (act.type === 'mcq') {
        renderMCQLayout(act, container);
      } else if (act.type === 'reorder') {
        renderReorderLayout(act, container);
      } else if (act.type === 'matching') {
        renderMatchingLayout(act, container);
      } else if (act.type === 'matching_tib') {
        renderMatchingTibLayout(act, container);
      } else if (act.type === 'audio_reorder') {
        renderAudioReorderLayout(act, container);
      } else if (act.type === 'select_meaning') {
        renderSelectMeaningLayout(act, container);
      } else if (act.type === 'select_meaning_tib') {
        renderSelectMeaningTibLayout(act, container);
      } else if (act.type === 'select_sentence_tib') {
        renderSelectSentenceTibLayout(act, container);
      } else if (act.type === 'chat_complete') {
        renderChatCompleteLayout(act, container);
      } else if (act.type === 'qa_sentence') {
        renderQASentenceLayout(act, container);
      } else if (act.type === 'qa_tib') {
        renderQATibLayout(act, container);
      } else if (act.type === 'test' || act.type === 'test_sentence') {
        renderTestLayout(act, container);
      }


      // Restore saved answers when reviewing a previously completed activity
      restoreActivityAnswerState(act);

      updateProgressBar();
      updateNavButtons();
      if (isTeacherMode) updateTeacherEditor();
    }

      const hasTibetan = w.tibetan && w.tibetan.trim() !== '';

      if (hasPhonetics) {
        const phonSpan = document.createElement('div');

          wordRow.className = 'flex flex-wrap justify-center gap-3 w-full max-w-2xl mx-auto mb-4';

          const preferredCardWidth = wordsPerRow >= 4 ? 'min-w-[110px] max-w-[140px]' : wordsPerRow === 2 ? 'min-w-[150px] max-w-[200px]' : 'min-w-[130px] max-w-[170px]';

            const hasTibetan = w.tibetan && w.tibetan.trim() !== '';

            if (hasTibetan) {

          container.appendChild(wordRow);

    // --- LAYOUT 0: Vocabulary Tiles ---
    function renderTilesLayout(act, container) {
      document.getElementById('btn-check').disabled = false;

      const titleEl = document.createElement('h1');
      titleEl.className = 'text-2xl font-bold text-center text-gray-800 mb-3 font-fredoka';
      titleEl.innerText = act.title || "Practice Vocabulary Tiles";
      container.appendChild(titleEl);

      // Instruction text directly under the title (top)
      const instructionNotice = document.createElement('p');
      instructionNotice.className = 'text-center text-sm font-bold text-amber-700 bg-amber-50 border border-amber-200 rounded-xl p-3 shadow-sm font-nunito mb-6 max-w-2xl mx-auto';
      instructionNotice.innerText = act.instructionText !== undefined ? act.instructionText : "Read the English word and try to remember the Tibetan word. Keep practicing until you know them all!";
      container.appendChild(instructionNotice);

      const maxTiles = act.tilesPerRow || 3;

      const rowsContainer = document.createElement('div');
      rowsContainer.id = 'tiles-rows-wrapper';
      rowsContainer.className = 'space-y-4 mb-6 flex flex-col items-center w-full';

      (act.rows || []).forEach((row, rIdx) => {
        const rowGrid = document.createElement('div');
        rowGrid.className = 'flex justify-center flex-wrap gap-3 w-full max-w-2xl mx-auto';

        for (let cIdx = 0; cIdx < row.length && cIdx < maxTiles; cIdx++) {
          const item = row[cIdx];
          if (!item) continue;

          const tileCard = document.createElement('div');
          const tileKey = `${act.id}_r${rIdx}_c${cIdx}`;

          tileCard.id = `tile-card-${tileKey}`;
          const isRevealed = !!revealedTileMap[tileKey];
          renderSingleTileCardContent(tileCard, item, isRevealed, maxTiles);

          tileCard.onclick = () => {
            toggleTileFlip(act.id, rIdx, cIdx, item);
          };

          rowGrid.appendChild(tileCard);
        }

        rowsContainer.appendChild(rowGrid);
      });

      container.appendChild(rowsContainer);
    }

    function toggleTileFlip(actId, rIdx, cIdx, item) {
      const tileKey = `${actId}_r${rIdx}_c${cIdx}`;
      revealedTileMap[tileKey] = !revealedTileMap[tileKey];
      playSoundEffect('tap');

      if (item.audio) playAudioBase64(item.audio);

      const tileCard = document.getElementById(`tile-card-${tileKey}`);
      if (tileCard) {
        const act = lessonData.activities[currentActivityIndex];
        const maxTiles = (act && act.tilesPerRow) ? act.tilesPerRow : 3;
        renderSingleTileCardContent(tileCard, item, revealedTileMap[tileKey], maxTiles);
      }
    }

    function renderSingleTileCardContent(tileCard, item, isRevealed, tilesPerRow) {
      tileCard.innerHTML = '';

      let widthClass = 'w-full sm:w-[calc(33.333%-0.75rem)]';
      if (tilesPerRow === 2) {
        widthClass = 'w-full sm:w-[calc(50%-0.75rem)] max-w-[280px]';
      } else if (tilesPerRow === 4) {
        widthClass = 'w-full sm:w-[calc(25%-0.75rem)]';
      }

      tileCard.className = `duo-card rounded-2xl p-3 flex flex-col items-center justify-center cursor-pointer bg-white min-h-[110px] text-center transition-all duration-200 select-none shadow-sm ${widthClass}`;

      if (isRevealed) {
        tileCard.classList.add('bg-sky-50', 'border-sky-300');

        if (item.image && item.image.trim() !== '') {
          const tileImg = document.createElement('img');
          tileImg.src = item.image;
          tileImg.className = 'w-16 h-16 object-contain mb-2 rounded-lg';
          tileCard.appendChild(tileImg);
        }

        const tibText = document.createElement('div');
        tibText.className = 'tibetan-text text-xl font-bold text-sky-900 border-b border-sky-100 pb-1 w-full text-center flex items-center justify-center';
        
        const tibSpan = document.createElement('span');
        tibSpan.innerText = item.tibetan || '';
        tibText.appendChild(tibSpan);

        tileCard.appendChild(tibText);

        if (lessonData.settings.showPhonetics && item.phonetics) {
          const phonText = document.createElement('div');
          phonText.className = 'text-xs font-bold text-sky-600 mt-1';
          phonText.innerText = item.phonetics;
          tileCard.appendChild(phonText);
        }

        if (lessonData.settings.showEnglish && item.english) {
          const engText = document.createElement('div');
          engText.className = 'text-xs font-bold text-gray-500 mt-0.5';
          engText.innerText = item.english;
          tileCard.appendChild(engText);
        }
      } else {
        const engFront = document.createElement('div');
        engFront.className = 'text-base font-bold text-gray-700 font-fredoka';
        engFront.innerText = item.english || '';

        const tapHint = document.createElement('div');
        tapHint.className = 'text-[10px] font-bold text-gray-400 mt-1 uppercase tracking-wider';
        tapHint.innerText = 'Tap to reveal';

        tileCard.appendChild(engFront);
        tapHint && tileCard.appendChild(tapHint);
      }
    }

    // --- LAYOUT 1: MCQ ---
    function renderMCQLayout(act, container) {

      const titleEl = document.createElement('h1');

        tibText.className = 'tibetan-text text-xl font-bold text-gray-800';

        if (lessonData.settings.showPhonetics && opt.phonetics) {

          phonText.className = 'text-base text-gray-500 font-bold';

    function selectMCQOption(optId, audioBase64) {
      selectedOptionId = optId;
      document.querySelectorAll('.duo-card').forEach(c => c.classList.remove('selected'));
      const card = document.getElementById(`opt-card-${optId}`);
      if (card) card.classList.add('selected');

      playSoundEffect('tap');
      document.getElementById('btn-check').disabled = false;

      wordBank.id = 'word-bank';
      wordBank.className = isSentenceMode

        : 'flex flex-wrap justify-center gap-2.5';

      const displayWords = previewScrambledWordsMap[act.id] || (act.words || []);
      const prefillIds = new Set((act.words || []).filter(w => w.isPrefill && !w.isDistractor).map(w => w.id));

      displayWords.forEach(w => {
        if (prefillIds.has(w.id)) return; // prefilled words are already in the answer slots, not in the bank
        const tile = document.createElement('button');
        tile.id = `bank-tile-${w.id}`;
        tile.className = 'duo-tile px-4 py-2.5 rounded-2xl flex flex-col items-center justify-center shadow-sm flex-shrink-0';

          engSpan.innerText = w.english;
          tile.appendChild(engSpan);
        }

        wordBank.appendChild(tile);

      container.appendChild(wordBank);

    async function playFullSentenceAudioSequence(act) {
      if (!act || !act.words) return;
      const correctTarget = act.correctOrder || act.words.filter(w => !w.isDistractor).map(w => w.id);
      
      for (const id of correctTarget) {
        const w = act.words.find(item => item.id === id);
        if (w && w.audio) {
          await playAudioPromise(w.audio);
          await new Promise(r => setTimeout(r, 120));
        }
      }
    }

    function playAudioPromise(base64) {
      return new Promise((resolve) => {
        try {
          if (lessonData.settings && lessonData.settings.playAudio === false) { resolve(); return; }
          const audio = new Audio(base64);
          audio.onended = () => resolve();
          audio.onerror = () => resolve();
          audio.play().catch(() => resolve());
        } catch (e) {
          resolve();
        }
      });
    }

      const bankTile = document.getElementById(`bank-tile-${wordObj.id}`);

    function updateReorderCheckButtonState() {
      const act = lessonData.activities[currentActivityIndex];
      const btn = document.getElementById('btn-check');
      if (!btn) return;
      if (act && act.type === 'reorder') {
        const prefillSet = new Set((act.words || []).filter(w => w.isPrefill && !w.isDistractor).map(w => w.id));
        // Always follow the visual order of non-distractor tiles in the editor (CORRECT SENTENCE ORDER)
        const correctTarget = (act.words || []).filter(w => !w.isDistractor).map(w => w.id);
        const blankCount = correctTarget.filter(id => !prefillSet.has(id)).length;
        // Enable if all blanks are filled (or there are no blanks at all)
        btn.disabled = selectedWordTileIds.length < blankCount;
      } else {
        btn.disabled = selectedWordTileIds.length === 0;
      }

    function renderAnswerSlotTiles() {
      const slots = document.getElementById('answer-slots');
      if (!slots) return;
      slots.innerHTML = '';

      const act = lessonData.activities[currentActivityIndex];

      // Special handling for Sentence Reorder with pre-filled words: keep correct positions
      if (act && act.type === 'reorder') {
        const prefillSet = new Set((act.words || []).filter(w => w.isPrefill && !w.isDistractor).map(w => w.id));
        // Always follow the visual order of non-distractor tiles in the editor (CORRECT SENTENCE ORDER)
        const correctTarget = (act.words || []).filter(w => !w.isDistractor).map(w => w.id);
        let selIdx = 0;

        correctTarget.forEach((wordId) => {
          const wordObj = (act.words || []).find(w => w.id === wordId);
          if (!wordObj) return;

          if (prefillSet.has(wordId)) {
            // Locked pre-filled tile in its correct position
            const slotTile = document.createElement('div');

              phonSpan.className = 'text-xs text-gray-500 font-bold mt-0.5';
              phonSpan.innerText = wordObj.phonetics;
              slotTile.appendChild(phonSpan);

              engSpan.className = 'text-xs text-gray-500 font-bold';
              engSpan.innerText = wordObj.english;
              slotTile.appendChild(engSpan);
            }
            slots.appendChild(slotTile);
          } else {
            // Blank position: show user-selected tile if available, otherwise a light placeholder
            if (selIdx < selectedWordTileIds.length) {
              const selId = selectedWordTileIds[selIdx];
              const selObj = (act.words || []).find(w => w.id === selId) || wordObj;
              const slotTile = document.createElement('button');
              slotTile.id = `slot-tile-${selId}`;

                engSpan.innerText = selObj.english;

              slots.appendChild(empty);

      // Default behavior for audio_reorder / chat_complete (and any non-reorder)
      selectedWordTileIds.forEach((wordId) => {
        const wordObj = act.words.find(w => w.id === wordId);
        if (!wordObj) return;

        slotTile.onclick = () => deselectWordTile(wordObj.id);

        tibSpan.innerText = wordObj.tibetan;

    function getMatchingTibSideWord(pair, side) {
      // Antonym pair format: { left: {...}, right: {...} }
      // Legacy single-word format fallback
      if (pair && pair.left && pair.right) {
        return pair[side] || {};
      }
      return {
        tibetan: pair.tibetan || '',
        phonetics: pair.phonetics || '',
        english: pair.english || '',
        audio: pair.audio || '',
        image: pair.image || ''
      };
    }

    function createMatchingTibCard(pair, side) {
      const cardKey = `${side}-${pair.id}`;
      const word = getMatchingTibSideWord(pair, side);
      const card = document.createElement('div');
      card.className = 'duo-card match-tib-card rounded-2xl cursor-pointer bg-white relative text-center overflow-hidden';
      card.id = `match-${side}-${pair.id}`;
      card.dataset.pairId = pair.id;
      card.dataset.side = side;

      const inner = document.createElement('div');
      inner.className = 'match-tib-inner';

      // Front face: Tibetan (+ optional phonetics) — sizes the card
      const front = document.createElement('div');
      front.className = 'match-tib-face front';
      const tibText = document.createElement('span');
      tibText.className = 'tibetan-text text-lg font-bold text-gray-800 leading-relaxed';
      tibText.innerText = word.tibetan || '';
      front.appendChild(tibText);
      if (lessonData.settings.showPhonetics && word.phonetics) {
        const phonText = document.createElement('span');
        phonText.className = 'text-xs text-gray-500 font-bold mt-0.5';
        phonText.innerText = word.phonetics;
        front.appendChild(phonText);
      }

      // Back face: English (+ optional image) — only revealable after match
      const back = document.createElement('div');
      back.className = 'match-tib-face back bg-sky-50';
      if (word.image && word.image.trim() !== '') {
        const img = document.createElement('img');
        img.src = word.image;
        img.className = 'w-10 h-10 object-contain mb-1 rounded';
        back.appendChild(img);
      }
      const engText = document.createElement('span');
      engText.className = 'text-base font-bold text-sky-800 font-fredoka';
      engText.innerText = word.english || '';
      back.appendChild(engText);

      inner.appendChild(front);
      inner.appendChild(back);
      card.appendChild(inner);

      if (flippedMatchingTibIds.has(cardKey)) {
        card.classList.add('is-flipped');
      }

      card.onclick = () => {
        // Flip is only allowed AFTER this pair has been correctly matched
        if (matchedPairIds.includes(pair.id)) {
          toggleMatchingTibFlipOnly(card, cardKey, word);
          return;
        }
        // Before match: select only (Tibetan stays visible — no English reveal)
        playSoundEffect('tap');
        if (word.audio) playAudioBase64(word.audio);
        if (side === 'left') {
          selectMatchingTibLeft(pair.id);
        } else {
          selectMatchingTibRight(pair.id);
        }
      };

      return card;
    }

    function toggleMatchingTibFlipOnly(card, cardKey, word) {
      if (flippedMatchingTibIds.has(cardKey)) {
        flippedMatchingTibIds.delete(cardKey);
        card.classList.remove('is-flipped');
      } else {
        flippedMatchingTibIds.add(cardKey);
        card.classList.add('is-flipped');
      }
      playSoundEffect('tap');
      if (word && word.audio) playAudioBase64(word.audio);
    }

    function toggleQAFlip(flipKey, words, fullEnglish, side, actId, pIdx) {
      revealedQAMap[flipKey] = !revealedQAMap[flipKey];

        if (withAudio) playAudioBase64(withAudio.audio);
      }

      const block = document.getElementById(`qa-flip-${flipKey}`);
      if (block) {
        renderQAFlipSide(block, words, fullEnglish, !!revealedQAMap[flipKey], side, flipKey, actId, pIdx);
      }
    }

    function renderQAFlipSide(block, words, fullEnglish, isRevealed, side, flipKey, actId, pIdx) {
      block.innerHTML = '';

      const isQuestion = side === 'question';
      const labelColor = isQuestion ? 'text-purple-600' : 'text-emerald-600';
      const labelIcon = isQuestion ? 'fa-circle-question' : 'fa-comment-dots';
      const labelText = isQuestion ? 'Question' : 'Answer';
      const borderAccent = isRevealed
        ? (isQuestion ? 'border-purple-300 bg-purple-50/40' : 'border-emerald-300 bg-emerald-50/40')
        : 'border-gray-200 bg-white hover:border-sky-300';

      const inner = document.createElement('div');
      inner.className = `duo-card rounded-2xl p-3 cursor-pointer transition-all duration-200 select-none shadow-sm min-h-[90px] ${borderAccent}`;
      inner.onclick = () => toggleQAFlip(flipKey, words, fullEnglish, side, actId, pIdx);

      const label = document.createElement('div');
      label.className = `text-[11px] font-bold ${labelColor} uppercase mb-2 flex items-center gap-1`;
      label.innerHTML = `<i class="fa-solid ${labelIcon}"></i> ${labelText}`;
      inner.appendChild(label);

      if (!isRevealed) {
        // FRONT: Full natural English sentence
        const engRow = document.createElement('div');
        engRow.className = 'flex items-center justify-center py-3 px-2';

        const engText = (fullEnglish || '').trim();
        if (!engText) {
          // Fallback: join word-level English if full sentence not set
          const fallback = (words || []).map(w => (w.english || '').trim()).filter(Boolean).join(' ');
          const placeholder = document.createElement('span');

            ? 'text-lg font-bold text-gray-700 font-fredoka text-center leading-relaxed'

          engRow.appendChild(placeholder);
        } else {
          const sentenceEl = document.createElement('span');
          sentenceEl.className = 'text-lg font-bold text-gray-700 font-fredoka text-center leading-relaxed';
          sentenceEl.innerText = engText;
          engRow.appendChild(sentenceEl);
        }
        inner.appendChild(engRow);

        const tapHint = document.createElement('div');
        tapHint.className = 'text-[10px] font-bold text-gray-400 mt-1 uppercase tracking-wider text-center';
        tapHint.innerText = 'Tap to reveal Tibetan';
        inner.appendChild(tapHint);
      } else {
        // BACK: Tibetan word boxes with phonetics + English underneath

        tibRow.className = 'flex flex-wrap items-stretch justify-center gap-2';

    // --- LAYOUT: QA TIB (Fill-in-the-blank Q left / A right) ---
    function normalizeQATibPair(pair) {
      if (!pair) return pair;
      // Migrate legacy single-sentence format to multi-sentence arrays
      if (!Array.isArray(pair.questions)) {
        pair.questions = [{
          id: (pair.id || 'q') + '_q0',
          image: pair.questionImage || '',
          imagePosition: pair.questionImagePosition || 'start',
          words: pair.questionWords || [],
          correctOrder: pair.questionCorrectOrder || (pair.questionWords || []).filter(w => !w.isDistractor).map(w => w.id)
        }];
        delete pair.questionImage;
        delete pair.questionImagePosition;
        delete pair.questionWords;
        delete pair.questionCorrectOrder;
      }
      if (!Array.isArray(pair.answers)) {
        pair.answers = [{
          id: (pair.id || 'a') + '_a0',
          image: pair.answerImage || '',
          imagePosition: pair.answerImagePosition || 'start',
          words: pair.answerWords || [],
          correctOrder: pair.answerCorrectOrder || (pair.answerWords || []).filter(w => !w.isDistractor).map(w => w.id)
        }];
        delete pair.answerImage;
        delete pair.answerImagePosition;
        delete pair.answerWords;
        delete pair.answerCorrectOrder;
      }
      return pair;
    }

    function selectQATibWord(key, wordObj, pIdx, sideCode, sIdx) {
      if (!qaTibSelections[key]) qaTibSelections[key] = [];
      if (qaTibSelections[key].includes(wordObj.id)) return;
      qaTibSelections[key].push(wordObj.id);
      playSoundEffect('tap');
      if (wordObj.audio) playAudioBase64(wordObj.audio);
      const bankTile = document.getElementById(`qatib-tile-${key}-${wordObj.id}`);
      if (bankTile) bankTile.classList.add('used');
      renderQATibSlots(key, pIdx, sideCode, sIdx);
      updateQATibCheckButton();
    }

    function deselectQATibWord(key, wordId, pIdx, sideCode, sIdx) {
      qaTibSelections[key] = (qaTibSelections[key] || []).filter(id => id !== wordId);
      playSoundEffect('tap');
      const bankTile = document.getElementById(`qatib-tile-${key}-${wordId}`);
      if (bankTile) bankTile.classList.remove('used');
      renderQATibSlots(key, pIdx, sideCode, sIdx);
      updateQATibCheckButton();
    }

    function renderQATibSlots(key, pIdx, sideCode, sIdx) {
      const slots = document.getElementById(`qatib-slots-${key}`);
      if (!slots) return;
      slots.innerHTML = '';
      const act = lessonData.activities[currentActivityIndex];
      if (!act || act.type !== 'qa_tib') return;
      const pair = (act.pairs || [])[pIdx];
      if (!pair) return;
      normalizeQATibPair(pair);
      const sentList = sideCode === 'q' ? (pair.questions || []) : (pair.answers || []);
      const sent = sentList[sIdx];
      if (!sent) return;
      const words = sent.words || [];
      (qaTibSelections[key] || []).forEach(wordId => {
        const wordObj = words.find(w => w.id === wordId);
        if (!wordObj) return;
        const slotTile = document.createElement('button');
        slotTile.className = 'duo-tile px-3 py-2 rounded-2xl flex flex-col items-center justify-center bg-white border-2 border-sky-300 shadow-sm';
        slotTile.onclick = () => deselectQATibWord(key, wordObj.id, pIdx, sideCode, sIdx);
        const tibSpan = document.createElement('span');
        tibSpan.className = 'tibetan-text text-lg font-bold text-gray-800';
        tibSpan.innerText = wordObj.tibetan || '';
        slotTile.appendChild(tibSpan);
        if (lessonData.settings.showPhonetics && wordObj.phonetics) {
          const phonSpan = document.createElement('span');
          phonSpan.className = 'text-xs text-gray-500 font-bold mt-0.5';
          phonSpan.innerText = wordObj.phonetics;
          slotTile.appendChild(phonSpan);
        }
        if (lessonData.settings.showEnglish && wordObj.english) {
          const engSpan = document.createElement('span');
          engSpan.className = 'text-xs text-gray-500 font-bold';
          engSpan.innerText = wordObj.english;
          slotTile.appendChild(engSpan);
        }
        slots.appendChild(slotTile);
      });
    }

    function updateQATibCheckButton() {
      const act = lessonData.activities[currentActivityIndex];
      if (!act || act.type !== 'qa_tib') return;
      let anyFilled = false;
      Object.keys(qaTibSelections || {}).forEach(k => {
        if ((qaTibSelections[k] || []).length > 0) anyFilled = true;
      });
      document.getElementById('btn-check').disabled = !anyFilled;
    }

    // --- LAYOUT 7: Test (Fill-in-Blanks) ---
    function renderTestLayout(act, container) {

      testSelections = {};
      testSelectedTileId = null;
      testRemainingTries = act.maxTries !== undefined ? act.maxTries : 3;
      document.getElementById('btn-check').disabled = true;

      const headerRow = document.createElement('div');
      headerRow.className = 'flex items-center justify-between mb-6 flex-wrap gap-2 border-b pb-3';

      const titleEl = document.createElement('h1');
      titleEl.className = 'text-2xl font-bold text-gray-800 font-fredoka flex items-center gap-2';
      const testIcon = act.type === 'test_sentence' ? 'fa-file-lines text-indigo-500' : 'fa-file-pen text-amber-500';
      titleEl.innerHTML = `<i class="fa-solid ${testIcon}"></i> ${act.title || 'Time for a quick quiz challenge! Are you ready?'}`;


      const triesBadge = document.createElement('span');

      triesBadge.innerHTML = `<i class="fa-solid fa-heart text-amber-500"></i> Tries Left: <span id="test-tries-count">${testRemainingTries}</span>`;

      headerRow.appendChild(titleEl);
      headerRow.appendChild(triesBadge);
      container.appendChild(headerRow);

      const itemsBox = document.createElement('div');
      
      const perRow = act.itemsPerRow || 1;
      let gridColClass = 'grid-cols-1';
      if (perRow === 2) gridColClass = 'grid-cols-1 md:grid-cols-2';
      else if (perRow === 3) gridColClass = 'grid-cols-1 md:grid-cols-3';

      (act.items || []).forEach((item, itemIdx) => {
        const itemRow = document.createElement('div');

        const slot = document.createElement('div');
        slot.id = `test-slot-${itemIdx}`;
        slot.className = 'test-blank-slot min-w-[130px] min-h-[54px] rounded-xl px-3 py-1 flex flex-col items-center justify-center cursor-pointer relative shadow-inner';
        
        slot.ondragover = (e) => {
          e.preventDefault();
          slot.classList.add('drag-over');
        };
        slot.ondragleave = () => slot.classList.remove('drag-over');
        slot.ondrop = (e) => {
          e.preventDefault();
          slot.classList.remove('drag-over');

        itemsBox.appendChild(itemRow);

      container.appendChild(itemsBox);

      // Pool of draggable / tappable sentence/word tiles
      // Display rule: Tibetan + Phonetics ONLY — never show English meanings in the selection pool
      const poolHeading = document.createElement('h2');

      container.appendChild(poolHeading);

      poolBox.id = 'test-word-pool';

        tile.id = `test-tile-${tileObj.id}`;
        tile.draggable = true;
        tile.className = isSentencePool
          ? 'duo-tile px-4 py-3 rounded-2xl flex flex-col items-center justify-center shadow-sm select-none min-w-[160px] max-w-[280px] cursor-grab active:cursor-grabbing'
          : 'duo-tile px-4 py-2.5 rounded-2xl flex flex-col items-center justify-center shadow-sm select-none min-w-[100px] cursor-grab active:cursor-grabbing';

        if (lessonData.settings.showPhonetics && tileObj.phonetics) {
          const phonSpan = document.createElement('span');
          phonSpan.className = 'text-xs text-sky-600 font-bold mt-0.5 text-center';

      container.appendChild(poolBox);

    function getTestWordPoolList(act) {
      if (previewScrambledWordsMap[act.id]) {
        // Strip any accidental english field from cached pool tiles
        return previewScrambledWordsMap[act.id].map(t => ({
          id: t.id,
          tibetan: t.tibetan || '',
          phonetics: t.phonetics || '',
          audio: t.audio || ''
        }));
      }

      let pool = [];
      (act.items || []).forEach(item => {
        // Pool entries are Tibetan + Phonetics only (English lives only on blank slot labels)
        pool.push({
          id: 'test_item_' + item.id,
          tibetan: item.correctTibetan || '',
          phonetics: item.correctPhonetic || '',
          audio: item.audio || ''
        });
      });

      (act.distractors || []).forEach(d => {
        pool.push({
          id: 'test_dist_' + d.id,
          tibetan: d.tibetan || '',
          phonetics: d.phonetics || '',
          audio: d.audio || ''
        });
      });

      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }

      previewScrambledWordsMap[act.id] = pool;
      return pool;
    }


    function handleTestTileClick(tileObj) {
      playSoundEffect('tap');
      if (tileObj.audio) playAudioBase64(tileObj.audio);

      if (testSelectedTileId === tileObj.id) {
        testSelectedTileId = null;
      } else {
        testSelectedTileId = tileObj.id;
      }
      renderTestSlotsUI();
    }

    function handleTestSlotClick(itemIdx) {
      playSoundEffect('tap');

      if (testSelections[itemIdx]) {
        // Return tile to pool if slot already filled
        delete testSelections[itemIdx];
        testSelectedTileId = null;
        renderTestSlotsUI();
        return;
      }

      if (testSelectedTileId) {
        assignTileToTestSlot(testSelectedTileId, itemIdx);
        testSelectedTileId = null;
      }
    }

    function assignTileToTestSlot(tileId, itemIdx) {
      const act = lessonData.activities[currentActivityIndex];
      const pool = getTestWordPoolList(act);
      const tileObj = pool.find(t => t.id === tileId);
      if (!tileObj) return;

      // Remove from any other slot first
      Object.keys(testSelections).forEach(k => {
        if (testSelections[k] && testSelections[k].id === tileId) {
          delete testSelections[k];
        }
      });

      testSelections[itemIdx] = tileObj;
      playSoundEffect('tap');
      renderTestSlotsUI();
    }

    function renderTestSlotsUI() {
      const act = lessonData.activities[currentActivityIndex];
      if (!act || (act.type !== 'test' && act.type !== 'test_sentence')) return;


      const pool = getTestWordPoolList(act);

      // Highlight tapped pool tile
      pool.forEach(t => {
        const tileEl = document.getElementById(`test-tile-${t.id}`);
        if (!tileEl) return;

        const isUsed = Object.values(testSelections).some(sel => sel && sel.id === t.id);
        const isTapped = testSelectedTileId === t.id;

        tileEl.classList.remove('used', 'border-amber-400', 'bg-amber-50');

        if (isUsed) {
          tileEl.classList.add('used');
        } else if (isTapped) {
          tileEl.classList.add('border-amber-400', 'bg-amber-50');
        }
      });

      // Render slots
      (act.items || []).forEach((item, itemIdx) => {
        const slotEl = document.getElementById(`test-slot-${itemIdx}`);
        if (!slotEl) return;

        slotEl.innerHTML = '';
        const filledObj = testSelections[itemIdx];

        if (filledObj) {
          slotEl.className = 'test-blank-slot filled min-w-[130px] min-h-[54px] rounded-xl px-3 py-1 flex flex-col items-center justify-center cursor-pointer relative shadow-sm border-2 border-sky-400';

          const tibText = document.createElement('span');
          tibText.className = 'tibetan-text text-xl font-bold text-gray-800';
          tibText.innerText = filledObj.tibetan;
          slotEl.appendChild(tibText);

          if (lessonData.settings.showPhonetics && filledObj.phonetics) {
            const phonText = document.createElement('span');
            phonText.className = 'text-xs font-bold text-sky-600';
            phonText.innerText = filledObj.phonetics;
            slotEl.appendChild(phonText);
          }
        } else {
          slotEl.className = 'test-blank-slot min-w-[130px] min-h-[54px] rounded-xl px-3 py-1 flex flex-col items-center justify-center cursor-pointer relative shadow-inner';

          if (testSelectedTileId) {
            slotEl.classList.add('active-tap-target');
          }

          const engText = document.createElement('span');
          engText.className = 'text-sm font-bold text-blue-600 font-fredoka';
          engText.innerText = item.blankEnglish || 'Blank';
          slotEl.appendChild(engText);

          const hintText = document.createElement('span');
          hintText.className = 'text-[10px] text-gray-400 font-semibold uppercase tracking-wider';
          hintText.innerText = 'Drop / Tap here';
          slotEl.appendChild(hintText);
        }
      });

      const filledCount = Object.keys(testSelections).length;
      document.getElementById('btn-check').disabled = filledCount < (act.items || []).length;
    }

    // --- CHECK LOGIC ---
    function handleCheck() {
      const act = lessonData.activities[currentActivityIndex];
      let isCorrect = false;

      if (act.type === 'tiles' || act.type === 'introduction' || act.type === 'qa_sentence') {
        isCorrect = true;
      } else if (act.type === 'mcq' || act.type === 'select_meaning' || act.type === 'select_meaning_tib' || act.type === 'select_sentence_tib') {

        const selected = act.options.find(o => o.id === selectedOptionId);
        isCorrect = selected && selected.isCorrect;
      } else if (act.type === 'reorder' || act.type === 'audio_reorder' || act.type === 'chat_complete') {

        const containsDistractor = selectedWordTileIds.some(id => {
          const w = (act.words || []).find(item => item.id === id);
          return w && w.isDistractor;
        });

        if (containsDistractor) {
          isCorrect = false;
        } else {
          if (act.type === 'reorder') {
            // Always follow the visual order of non-distractor tiles in the editor (CORRECT SENTENCE ORDER)
            const correctTarget = (act.words || []).filter(w => !w.isDistractor).map(w => w.id);
            // For Sentence Reorder: only the non-prefill blanks need to be filled by the student
            const prefillSet = new Set((act.words || []).filter(w => w.isPrefill && !w.isDistractor).map(w => w.id));
            const blankCorrect = correctTarget.filter(id => !prefillSet.has(id));
            isCorrect = JSON.stringify(selectedWordTileIds) === JSON.stringify(blankCorrect);
          } else {
            const correctTarget = act.correctOrder || (act.words || []).filter(w => !w.isDistractor).map(w => w.id);
            isCorrect = JSON.stringify(selectedWordTileIds) === JSON.stringify(correctTarget);
          }
        }
      } else if (act.type === 'matching' || act.type === 'matching_tib') {
        isCorrect = matchedPairIds.length === (act.pairs || []).length;
      } else if (act.type === 'qa_tib') {
        let allSidesCorrect = true;
        (act.pairs || []).forEach((pair, pIdx) => {
          normalizeQATibPair(pair);
          (pair.questions || []).forEach((sent, sIdx) => {
            const key = `${pIdx}_q_${sIdx}`;
            const selected = qaTibSelections[key] || [];
            const words = sent.words || [];
            const correctOrder = sent.correctOrder || words.filter(w => !w.isDistractor).map(w => w.id);
            const hasDistractor = selected.some(id => {
              const w = words.find(item => item.id === id);
              return w && w.isDistractor;
            });
            if (hasDistractor || JSON.stringify(selected) !== JSON.stringify(correctOrder)) {
              allSidesCorrect = false;
            }
          });
          (pair.answers || []).forEach((sent, sIdx) => {
            const key = `${pIdx}_a_${sIdx}`;
            const selected = qaTibSelections[key] || [];
            const words = sent.words || [];
            const correctOrder = sent.correctOrder || words.filter(w => !w.isDistractor).map(w => w.id);
            const hasDistractor = selected.some(id => {
              const w = words.find(item => item.id === id);
              return w && w.isDistractor;
            });
            if (hasDistractor || JSON.stringify(selected) !== JSON.stringify(correctOrder)) {
              allSidesCorrect = false;
            }
          });
        });
        isCorrect = allSidesCorrect;
      } else if (act.type === 'test' || act.type === 'test_sentence') {
        let allItemsCorrect = true;
        (act.items || []).forEach((item, itemIdx) => {
          const userPlacedObj = testSelections[itemIdx];
          if (!userPlacedObj || userPlacedObj.tibetan !== item.correctTibetan) {
            allItemsCorrect = false;
          }
        });
        isCorrect = allItemsCorrect;
      }


      showFeedbackBanner(isCorrect);
    }

    function showFeedbackBanner(isCorrect) {
      isCurrentAnswerCorrect = isCorrect;

      playAnswerFeedbackSound(isCorrect);

      const banner = document.getElementById('feedback-banner');
      const icon = document.getElementById('feedback-icon');
      const title = document.getElementById('feedback-title');
      const detail = document.getElementById('feedback-detail');
      const bannerBtn = document.getElementById('feedback-next-btn');

      banner.classList.remove('hidden', 'bg-green-100', 'bg-amber-100', 'text-green-900', 'text-amber-900');

      const act = lessonData.activities[currentActivityIndex];

      if (isCorrect) {
        banner.classList.add('bg-green-100', 'text-green-900');
        icon.className = 'w-12 h-12 rounded-full flex items-center justify-center text-2xl font-bold bg-green-500 text-white';
        icon.innerHTML = `<i class="fa-solid fa-check"></i>`;
        title.innerText = 'Excellent!';
        detail.innerText = (act.type === 'test' || act.type === 'test_sentence') ? 'Congratulations! You passed the test!' : 'You got the correct answer.';

        bannerBtn.innerText = 'Continue';
        bannerBtn.className = 'px-8 py-3 rounded-2xl font-bold uppercase font-fredoka shadow-md bg-green-500 hover:bg-green-600 text-white';
        
        activityScores[act.id] = 100;

        if (typeof confetti === 'function') {
          confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
        }
      } else {
        if (act.type === 'test' || act.type === 'test_sentence') {
          testRemainingTries--;
          const countEl = document.getElementById('test-tries-count');
          if (countEl) countEl.innerText = testRemainingTries;

          if (testRemainingTries <= 0) {

            banner.classList.add('bg-amber-100', 'text-amber-900');
            icon.className = 'w-12 h-12 rounded-full flex items-center justify-center text-2xl font-bold bg-amber-500 text-white';
            icon.innerHTML = `🤔`;
            title.innerText = 'Test Failed!';
            detail.innerText = 'You ran out of tries. Restarting lesson from the beginning...';
            bannerBtn.innerText = 'Restart Lesson';
            bannerBtn.className = 'px-8 py-3 rounded-2xl font-bold uppercase font-fredoka shadow-md bg-amber-500 hover:bg-amber-600 text-white';
            
            activityScores[act.id] = 0;
            return;
          }
        }

        banner.classList.add('bg-amber-100', 'text-amber-900');
        icon.className = 'w-12 h-12 rounded-full flex items-center justify-center text-2xl font-bold bg-amber-500 text-white';
        icon.innerHTML = `🤔`;
        title.innerText = 'Not quite right';
        detail.innerText = (act.type === 'test' || act.type === 'test_sentence') ? `Some blanks are incorrect. Tries left: ${testRemainingTries}` : 'Try again to find the correct answer!';

        bannerBtn.innerText = 'Try Again';
        bannerBtn.className = 'px-8 py-3 rounded-2xl font-bold uppercase font-fredoka shadow-md bg-amber-500 hover:bg-amber-600 text-white';
        
        activityScores[act.id] = 0;
      }
    }

    function resetFeedbackBanner() {
      document.getElementById('feedback-banner').classList.add('hidden');
    }

    function handleBannerAction() {
      const act = lessonData.activities[currentActivityIndex];
      if (act && (act.type === 'test' || act.type === 'test_sentence') && testRemainingTries <= 0) {
        restartLesson();
        return;
      }


      if (isCurrentAnswerCorrect) {
        saveActivityAnswerState(act);
        nextActivity();
      } else {
        resetFeedbackBanner();
      }
    }

    function nextActivity() {
      const act = lessonData.activities[currentActivityIndex];
      const score = activityScores[act.id] || 0;

      if (act) saveActivityAnswerState(act);

      reportToPlatform("activity-complete", {
        activity: act.id,
        score: score,
        maxScore: 100
      });

      currentActivityIndex++;
      if (currentActivityIndex > maxReachedIndex) {
        maxReachedIndex = currentActivityIndex;
      }
      // Cap maxReached at last activity index when on completion screen path
      if (maxReachedIndex > lessonData.activities.length) {
        maxReachedIndex = lessonData.activities.length;
      }
      renderCurrentActivity();
    }


    function goBackActivity() {
      if (currentActivityIndex <= 0) return;
      // Save state only when currently on a real activity (not the completion screen)
      if (currentActivityIndex < lessonData.activities.length) {
        const curAct = lessonData.activities[currentActivityIndex];
        if (curAct) saveActivityAnswerState(curAct);
      }
      resetFeedbackBanner();
      currentActivityIndex--;
      renderCurrentActivity();
    }

    function goForwardActivity() {
      if (currentActivityIndex >= maxReachedIndex) return;
      if (currentActivityIndex < lessonData.activities.length) {
        const curAct = lessonData.activities[currentActivityIndex];
        if (curAct) saveActivityAnswerState(curAct);
      }
      resetFeedbackBanner();
      currentActivityIndex++;
      if (currentActivityIndex > maxReachedIndex) currentActivityIndex = maxReachedIndex;
      // Allow currentActivityIndex === activities.length to re-show the completion screen
      renderCurrentActivity();
    }

    function updateNavButtons() {
      const backBtn = document.getElementById('btn-back');
      const fwdBtn = document.getElementById('btn-forward');
      const checkBtn = document.getElementById('btn-check');
      if (!backBtn || !fwdBtn) return;

      const onCompletion = currentActivityIndex >= lessonData.activities.length;

      // Back: enabled when not on the first activity (also enabled on completion to review answers)
      backBtn.disabled = currentActivityIndex <= 0;
      if (onCompletion) {
        backBtn.innerHTML = `<i class="fa-solid fa-arrow-left"></i> Review Answers`;
      } else {
        backBtn.innerHTML = `<i class="fa-solid fa-arrow-left"></i> Back`;
      }

      // Forward: step toward furthest reached point; on completion there is nowhere further
      fwdBtn.disabled = onCompletion || currentActivityIndex >= maxReachedIndex;

      // Check is not used on the completion screen
      if (checkBtn) {
        if (onCompletion) {
          checkBtn.disabled = true;
          checkBtn.classList.add('invisible');
        } else {
          checkBtn.classList.remove('invisible');
        }
      }
    }


    function saveActivityAnswerState(act) {
      if (!act || !act.id) return;
      // Capture revealed tiles for this activity only
      const revealedTiles = {};
      Object.keys(revealedTileMap || {}).forEach(k => {
        if (k.indexOf(act.id + '_') === 0) revealedTiles[k] = !!revealedTileMap[k];
      });
      const revealedQA = {};
      Object.keys(revealedQAMap || {}).forEach(k => {
        if (k.indexOf(act.id + '_') === 0) revealedQA[k] = !!revealedQAMap[k];
      });

      activityAnswerState[act.id] = {
        selectedOptionId: selectedOptionId,
        selectedWordTileIds: Array.isArray(selectedWordTileIds) ? [...selectedWordTileIds] : [],
        matchedPairIds: Array.isArray(matchedPairIds) ? [...matchedPairIds] : [],
        selectedLeftMatchingId: selectedLeftMatchingId || null,
        selectedRightMatchingId: selectedRightMatchingId || null,
        flippedMatchingTibIds: flippedMatchingTibIds instanceof Set ? Array.from(flippedMatchingTibIds) : [],
        testSelections: JSON.parse(JSON.stringify(testSelections || {})),
        testSelectedTileId: testSelectedTileId || null,
        testRemainingTries: (typeof testRemainingTries !== 'undefined') ? testRemainingTries : undefined,
        revealedTiles: revealedTiles,
        revealedQA: revealedQA
      };
    }


    function restoreActivityAnswerState(act) {
      if (!act || !act.id) return;
      const state = activityAnswerState[act.id];
      if (!state) return;

      const checkBtn = document.getElementById('btn-check');

      // --- MCQ / Select Meaning / Select Sentence ---
      if (state.selectedOptionId) {
        selectedOptionId = state.selectedOptionId;
        const prefixes = ['opt-card-', 'meaning-opt-', 'meaning-tib-opt-', 'sentence-tib-opt-'];
        prefixes.forEach(prefix => {
          document.querySelectorAll(`#lesson-container [id^="${prefix}"]`).forEach(c => c.classList.remove('selected'));
          const card = document.getElementById(prefix + state.selectedOptionId);
          if (card) card.classList.add('selected');
        });
        if (checkBtn) checkBtn.disabled = false;
      }


      // --- Reorder / Audio Reorder / Chat Complete ---
      if (state.selectedWordTileIds && state.selectedWordTileIds.length > 0) {
        selectedWordTileIds = [...state.selectedWordTileIds];
        // Mark bank tiles as used
        selectedWordTileIds.forEach(id => {
          const bankTile = document.getElementById(`bank-tile-${id}`);
          if (bankTile) bankTile.classList.add('used');
        });
        // Rebuild answer slots
        if (typeof renderAnswerSlotTiles === 'function') {
          renderAnswerSlotTiles();
        }
        if (typeof updateReorderCheckButtonState === 'function') {
          updateReorderCheckButtonState();
        } else if (checkBtn) {
          checkBtn.disabled = selectedWordTileIds.length === 0;
        }
      }

      // --- Matching Pairs / Matching Pairs TIB ---
      if (state.matchedPairIds && state.matchedPairIds.length > 0) {
        matchedPairIds = [...state.matchedPairIds];
        matchedPairIds.forEach(id => {
          const leftCard = document.getElementById(`match-left-${id}`);
          const rightCard = document.getElementById(`match-right-${id}`);
          if (leftCard) {
            leftCard.classList.remove('selected', 'wrong');
            leftCard.classList.add('matched');
          }
          if (rightCard) {
            rightCard.classList.remove('selected', 'wrong');
            rightCard.classList.add('matched');
          }
        });
        selectedLeftMatchingId = null;
        selectedRightMatchingId = null;
        const actPairs = act.pairs || [];
        if (checkBtn && matchedPairIds.length === actPairs.length) {
          checkBtn.disabled = false;
        }
      }
      // Restore flipped state for Matching Pairs TIB
      if (act.type === 'matching_tib' && state.flippedMatchingTibIds && Array.isArray(state.flippedMatchingTibIds)) {
        flippedMatchingTibIds = new Set(state.flippedMatchingTibIds);
        flippedMatchingTibIds.forEach(key => {
          const dashIdx = key.indexOf('-');
          if (dashIdx < 0) return;
          const side = key.slice(0, dashIdx);
          const id = key.slice(dashIdx + 1);
          const card = document.getElementById(`match-${side}-${id}`);
          if (card) card.classList.add('is-flipped');
        });
      }

      // --- Test fill-in-blanks ---
      if (state.testSelections && Object.keys(state.testSelections).length > 0) {
        testSelections = JSON.parse(JSON.stringify(state.testSelections));
        testSelectedTileId = null;
        if (typeof state.testRemainingTries === 'number') {
          testRemainingTries = state.testRemainingTries;
          const countEl = document.getElementById('test-tries-count');
          if (countEl) countEl.innerText = testRemainingTries;
        }
        if (typeof renderTestSlotsUI === 'function') {
          renderTestSlotsUI();
        }
        if (checkBtn && act.items) {
          const filledCount = Object.keys(testSelections).filter(k => testSelections[k]).length;
          checkBtn.disabled = filledCount < (act.items || []).length;
        }
      }


      // --- Practice Tiles revealed state ---
      if (state.revealedTiles) {
        Object.keys(state.revealedTiles).forEach(k => {
          revealedTileMap[k] = state.revealedTiles[k];
        });
        // Re-render revealed tile cards
        Object.keys(state.revealedTiles).forEach(tileKey => {
          if (!state.revealedTiles[tileKey]) return;
          const tileCard = document.getElementById(`tile-card-${tileKey}`);
          if (!tileCard) return;
          // Parse rIdx/cIdx from key: `${actId}_r${rIdx}_c${cIdx}`
          const m = tileKey.match(/_r(\d+)_c(\d+)$/);
          if (!m || !act.rows) return;
          const rIdx = parseInt(m[1], 10);
          const cIdx = parseInt(m[2], 10);
          const item = act.rows[rIdx] && act.rows[rIdx][cIdx];
          if (item && typeof renderSingleTileCardContent === 'function') {
            const maxTiles = act.tilesPerRow || 3;
            renderSingleTileCardContent(tileCard, item, true, maxTiles);
          }
        });
      }

      // --- QA Sentence flip state ---
      if (state.revealedQA) {
        Object.keys(state.revealedQA).forEach(k => {
          revealedQAMap[k] = state.revealedQA[k];
        });
        // Re-render flipped sides if DOM exists
        Object.keys(state.revealedQA).forEach(flipKey => {
          if (!state.revealedQA[flipKey]) return;
          const block = document.getElementById(`qa-flip-${flipKey}`);
          if (!block || !act.pairs) return;
          const m = flipKey.match(/_p(\d+)_(q|a)$/);
          if (!m) return;
          const pIdx = parseInt(m[1], 10);
          const side = m[2] === 'q' ? 'question' : 'answer';
          const pair = act.pairs[pIdx];
          if (!pair) return;
          const words = side === 'question' ? (pair.question || []) : (pair.answer || []);
          const fullEnglish = side === 'question' ? (pair.questionEnglish || '') : (pair.answerEnglish || '');
          if (typeof renderQAFlipSide === 'function') {
            renderQAFlipSide(block, words, fullEnglish, true, side, flipKey, act.id, pIdx);
          }
        });
      }

      // Completed activity: always allow Check so student can Continue again if needed
      if (activityScores[act.id] === 100 && checkBtn) {
        checkBtn.disabled = false;
      }
    }

    function editWordBankCategory(idx, newName) {
      const val = newName.trim();

      if (!lessonData.wordBankCategories) return;

      lessonData.wordBankCategories[idx] = val;

      // Update words in bank that used old category name
      if (lessonData.wordBank) {
        lessonData.wordBank.forEach(wb => {
          if (wb.category === oldName) wb.category = val;

      renderCategoryListModal();

        lessonData.wordBankCategories.splice(idx, 1);

        renderWordBankManager();
        updateTeacherEditor();

    // --- ACTIVITY USAGE TRACKER FOR WORD BANK (Traffic Light Indicator) ---
    function getWordActivityUsageCount(wordObj) {
      if (!wordObj || !lessonData.activities) return 0;
      const targetTib = (wordObj.tibetan || '').trim();
      if (!targetTib) return 0;

      let count = 0;

      lessonData.activities.forEach(act => {
        let usedInAct = false;

        if (act.type === 'introduction' && act.words) {
          usedInAct = act.words.some(w => (w.tibetan || '').trim() === targetTib);
        } else if (act.type === 'tiles' && act.rows) {
          usedInAct = act.rows.some(r => r.some(t => (t.tibetan || '').trim() === targetTib));
        } else if ((act.type === 'mcq' || act.type === 'select_meaning') && act.options) {
          usedInAct = act.options.some(o => (o.tibetan || '').trim() === targetTib);
        } else if (act.type === 'select_meaning_tib') {
          usedInAct = (act.targetTibetan || '').trim() === targetTib;
        } else if (act.type === 'select_sentence_tib' && act.targetWords) {
          usedInAct = act.targetWords.some(w => (w.tibetan || '').trim() === targetTib);
        } else if ((act.type === 'reorder' || act.type === 'audio_reorder' || act.type === 'chat_complete') && act.words) {

          usedInAct = act.words.some(w => (w.tibetan || '').trim() === targetTib);
          if (!usedInAct && act.type === 'chat_complete' && act.questionTibetan) {
            usedInAct = act.questionTibetan.includes(targetTib);
          }
        } else if (act.type === 'matching' && act.pairs) {
          usedInAct = act.pairs.some(p => (p.tibetan || '').trim() === targetTib);
        } else if (act.type === 'matching_tib' && act.pairs) {
          usedInAct = act.pairs.some(p =>
            (p.left && (p.left.tibetan || '').trim() === targetTib) ||
            (p.right && (p.right.tibetan || '').trim() === targetTib) ||
            (p.tibetan || '').trim() === targetTib
          );
        } else if (act.type === 'qa_sentence' && act.pairs) {
          usedInAct = act.pairs.some(p =>
            (p.question || []).some(w => (w.tibetan || '').trim() === targetTib) ||
            (p.answer || []).some(w => (w.tibetan || '').trim() === targetTib)
          );
        } else if (act.type === 'test' || act.type === 'test_sentence') {
          if (act.items) {
            usedInAct = act.items.some(i => (i.correctTibetan || '').trim() === targetTib);
          }
          if (!usedInAct && act.distractors) {
            usedInAct = act.distractors.some(d => (d.tibetan || '').trim() === targetTib);
          }
        }

        if (usedInAct) count++;
      });



      return count;
    }

    // --- WORD BANK CRUD & BATCH MOVE ENGINE ---
    function renderWordBankManager() {
      const bankContainer = document.getElementById('teacher-word-bank');
      if (!bankContainer) return;

      if (!lessonData.wordBankCategories) lessonData.wordBankCategories = [];
      if (!lessonData.wordBank) lessonData.wordBank = [];

      // Update Filter Options
      const filterSel = document.getElementById('wb-category-filter');
      const batchSel = document.getElementById('wb-batch-category-target');
      
      const currentFilter = filterSel ? filterSel.value : 'ALL';

      let catOptionsHtml = `<option value="ALL">All Categories</option><option value="UNCATEGORIZED">Uncategorized</option>`;
      let batchOptionsHtml = `<option value="">-- Move Selected To --</option><option value="UNCATEGORIZED">Uncategorized</option>`;

      lessonData.wordBankCategories.forEach(cat => {
        catOptionsHtml += `<option value="${cat}">${cat}</option>`;
        batchOptionsHtml += `<option value="${cat}">${cat}</option>`;
      });

      if (filterSel) filterSel.innerHTML = catOptionsHtml;
      if (batchSel) batchSel.innerHTML = batchOptionsHtml;
      if (filterSel) filterSel.value = currentFilter;

      if (lessonData.wordBank.length === 0) {
        bankContainer.innerHTML = `<p class="text-xs text-gray-400 italic py-2 text-center">Your Word Bank is empty. Click "+ Add Word" above to get started!</p>`;
        return;
      }

      let html = '';
      let visibleCount = 0;

      lessonData.wordBank.forEach((item, wbIdx) => {
        const itemCat = item.category || 'UNCATEGORIZED';
        
        // Filter Check
        if (currentFilter !== 'ALL') {
          if (currentFilter === 'UNCATEGORIZED' && item.category) return;
          if (currentFilter !== 'UNCATEGORIZED' && item.category !== currentFilter) return;
        }

        visibleCount++;

      if (selectedWordBankIndices.size === 0) {

        alert("Please select a target category from the dropdown menu.");

      ensureIntroSentenceRows(act);

      if (!lessonData.sentenceBank) lessonData.sentenceBank = [];
      const words = rowWords.map(w => ({
        id: 'sbw_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
        tibetan: w.tibetan || '',
        phonetics: w.phonetics || '',
        english: w.english || '',
        audio: w.audio || ''
      }));
      const phonetics = words.map(w => w.phonetics).filter(Boolean).join(' · ');
      const englishMeaning = words.map(w => w.english).filter(Boolean).join(' ');

      // Duplicate check by joined Tibetan
      const tibKey = words.map(w => (w.tibetan || '').trim()).filter(Boolean).join(' ');
      const isDup = lessonData.sentenceBank.some(s =>
        (s.words || []).map(w => (w.tibetan || '').trim()).filter(Boolean).join(' ') === tibKey
      );
      if (isDup) {
        alert('This Tibetan sentence is already in the Sentence Bank.');
        return;

      lessonData.sentenceBank.push({

        words: words,
        phonetics: phonetics,
        englishMeaning: englishMeaning,
        category: ''
      });

      playSoundEffect('correct');
      alert('Sentence saved to Sentence Bank!');

        id: 'sbw_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
        tibetan: w.tibetan || '',
        phonetics: w.phonetics || '',
        english: w.english || '',
        audio: w.audio || ''
      }));

      const phonetics = words.map(w => w.phonetics).filter(Boolean).join(' · ');
      // Prefer full-sentence English field, fall back to joined word English
      const fullEngKey = side === 'question' ? 'questionEnglish' : 'answerEnglish';
      const englishMeaning = (pair[fullEngKey] || '').trim() ||
        words.map(w => w.english).filter(Boolean).join(' ');

      if (!tibKey) {
        alert('Add Tibetan text before saving to the Sentence Bank.');

      }
      const isDup = lessonData.sentenceBank.some(s =>
        (s.words || []).map(w => (w.tibetan || '').trim()).filter(Boolean).join(' ') === tibKey
      );
      if (isDup) {
        alert('This Tibetan sentence is already in the Sentence Bank.');
        return;
      }

      lessonData.sentenceBank.push({
        id: 'sb_' + Date.now().toString(36),
        words: words,
        phonetics: phonetics,
        englishMeaning: englishMeaning,
        category: ''
      });

    function importSentenceBankToTestSentenceItem(sbIdxStr) {
      if (sbIdxStr === '' || sbIdxStr === null || sbIdxStr === undefined) return;
      const sbIdx = parseInt(sbIdxStr, 10);
      const s = lessonData.sentenceBank && lessonData.sentenceBank[sbIdx];
      const act = lessonData.activities[currentActivityIndex];
      if (!s || !act || act.type !== 'test_sentence') return;

      const tibetan = (s.words || []).map(w => w.tibetan || '').filter(Boolean).join(' ');
      const phonetics = (s.phonetics || (s.words || []).map(w => w.phonetics || '').filter(Boolean).join(' · '));
      const english = (s.englishMeaning || '').trim();

    function renderWordBankDropdownMenu(onSelectJsFnCall) {

      if (!lessonData.wordBank || lessonData.wordBank.length === 0) {
        return `<span class="text-[10px] text-gray-400 italic">Word Bank Empty</span>`;
      }

      // Helper: is this word already used inside the *currently selected* activity only?
      function isUsedInCurrentActivity(wordObj) {
        const act = lessonData.activities[currentActivityIndex];
        if (!act || !wordObj) return false;
        const targetTib = (wordObj.tibetan || '').trim();
        if (!targetTib) return false;

        if (act.type === 'introduction' && act.words) {
          return act.words.some(w => (w.tibetan || '').trim() === targetTib);
        } else if (act.type === 'tiles' && act.rows) {
          return act.rows.some(r => r.some(t => (t.tibetan || '').trim() === targetTib));
        } else if ((act.type === 'mcq' || act.type === 'select_meaning') && act.options) {
          return act.options.some(o => (o.tibetan || '').trim() === targetTib);
        } else if (act.type === 'select_meaning_tib') {
          return (act.targetTibetan || '').trim() === targetTib ||
                 (act.options || []).some(o => (o.english || '').trim() === (wordObj.english || '').trim());
        } else if (act.type === 'select_sentence_tib' && act.targetWords) {
          return act.targetWords.some(w => (w.tibetan || '').trim() === targetTib);
        } else if ((act.type === 'reorder' || act.type === 'audio_reorder' || act.type === 'chat_complete') && act.words) {

          if (act.words.some(w => (w.tibetan || '').trim() === targetTib)) return true;
          if (act.type === 'chat_complete' && act.questionTibetan) {
            return act.questionTibetan.includes(targetTib);
          }
          return false;
        } else if (act.type === 'matching' && act.pairs) {
          return act.pairs.some(p => (p.tibetan || '').trim() === targetTib);
        } else if (act.type === 'matching_tib' && act.pairs) {
          return act.pairs.some(p =>
            (p.left && (p.left.tibetan || '').trim() === targetTib) ||
            (p.right && (p.right.tibetan || '').trim() === targetTib) ||
            (p.tibetan || '').trim() === targetTib
          );
        } else if (act.type === 'qa_sentence' && act.pairs) {
          return act.pairs.some(p =>
            (p.question || []).some(w => (w.tibetan || '').trim() === targetTib) ||
            (p.answer || []).some(w => (w.tibetan || '').trim() === targetTib)
          );
        } else if (act.type === 'test' || act.type === 'test_sentence') {
          if (act.items && act.items.some(i => (i.correctTibetan || '').trim() === targetTib)) return true;
          if (act.distractors && act.distractors.some(d => (d.tibetan || '').trim() === targetTib)) return true;

          return false;
        }
        return false;
      }


      // Group by category for easier selection (optgroups)
      const groups = {};
      lessonData.wordBank.forEach((wb, i) => {
        const cat = (wb.category || '').trim() || 'Uncategorized';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push({ wb, i });
      });

      let optionsHtml = `<option value="">-- Import from Word Bank --</option>`;

      // Preserve category order from wordBankCategories, then any extra categories, then Uncategorized
      const orderedCats = [...(lessonData.wordBankCategories || [])];
      Object.keys(groups).forEach(c => {
        if (c !== 'Uncategorized' && !orderedCats.includes(c)) orderedCats.push(c);
      });
      if (groups['Uncategorized']) orderedCats.push('Uncategorized');

      orderedCats.forEach(cat => {
        if (!groups[cat] || groups[cat].length === 0) return;
        const safeLabel = String(cat).replace(/"/g, '&quot;');
        optionsHtml += `<optgroup label="${safeLabel}">`;
        groups[cat].forEach(({ wb, i }) => {
          const audioMarker = wb.audio ? ' 🔊' : '';
          const usedInCurrent = isUsedInCurrentActivity(wb);
          const usedInLesson = getWordActivityUsageCount(wb) > 0;
          // 🟢 = already used in the current activity
          // 🟡 = used somewhere in the lesson (so you can quickly reuse the lesson vocabulary)
          let markers = '';
          if (usedInCurrent) markers += ' 🟢';
          if (usedInLesson) markers += ' 🟡';
          optionsHtml += `<option value="${i}">${wb.english || 'Item'} (${wb.tibetan || ''})${markers}${audioMarker}</option>`;
        });
        optionsHtml += `</optgroup>`;
      });

      return `
        <select onchange="${onSelectJsFnCall}" class="bg-amber-50 border border-amber-300 rounded text-[11px] font-bold text-amber-900 p-1 hover:bg-amber-100 cursor-pointer">
          ${optionsHtml}
        </select>
      `;
    }

    function moveActivity(fromIdx, direction) {
      const toIdx = fromIdx + direction;
      if (toIdx < 0 || toIdx >= lessonData.activities.length) return;

      const temp = lessonData.activities[fromIdx];
      lessonData.activities[fromIdx] = lessonData.activities[toIdx];
      lessonData.activities[toIdx] = temp;

      if (currentActivityIndex === fromIdx) {
        currentActivityIndex = toIdx;
      } else if (currentActivityIndex === toIdx) {
        currentActivityIndex = fromIdx;
      }

      populateTeacherActivityDropdown();
      renderCategorizedExerciseBrowser();
      renderCurrentActivity();
    }
