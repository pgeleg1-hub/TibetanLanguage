<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tibetan Practice Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; background: #f8fafc; }
    
    /* Top Status Bar */
    #tracker-bar {
      height: 50px;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 0.9rem;
      border-bottom: 2px solid #2563eb;
    }
    
    .status-item { display: flex; align-items: center; gap: 8px; }
    .badge { background: #1e293b; padding: 4px 10px; border-radius: 6px; border: 1px solid #334155; }
    .status-active { color: #4ade80; font-weight: 600; }
    .status-idle { color: #f87171; font-weight: 600; }
    
    .finish-btn {
      background: #2563eb; color: white; border: none; padding: 6px 14px;
      border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s;
    }
    .finish-btn:hover { background: #1d4ed8; }

    /* Embedded Exercise Viewport */
    #exercise-frame {
      width: 100%;
      height: calc(100vh - 50px);
      border: none;
    }
  </style>
</head>
<body>

  <!-- Top Tracker Control Bar -->
  <div id="tracker-bar">
    <div class="status-item">
      <span>Student:</span>
      <span id="display-student" class="badge">---</span>
    </div>

    <div class="status-item">
      <span>Active Time:</span>
      <span id="display-time" class="badge">0m 0s</span>
      <span id="status-indicator" class="status-active">● Active</span>
    </div>

    <button class="finish-btn" onclick="submitSession()">Submit & Exit</button>
  </div>

  <!-- The Untouched Exercise Game Loads Here -->
  <iframe id="exercise-frame" src=""></iframe>

  <script>
    // ⚠️ REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT WEB APP URL FROM STEP 2
    const GOOGLE_WEB_APP_URL = https://script.google.com/macros/s/AKfycbz-803kU71QeK_CvKnEbpdJLpdNsBgOrOp7nIeYixy-crY10UOaQd94uMJ9z_qJ_cw0Yg/exec;

    // Parse parameters from URL (e.g., ?file=Norbulinga/pronouns.html)
    const urlParams = new URLSearchParams(window.location.search);
    const exerciseFilePath = urlParams.get('file');

    if (!exerciseFilePath) {
      alert("No exercise file specified.");
      window.location.href = "./index.html";
    }

    // 1. Get or Prompt for Unique Student Code
    let studentCode = localStorage.getItem('tibetan_student_code');
    if (!studentCode || studentCode === 'null') {
      studentCode = prompt("Please enter your Student Code (e.g., NOR-101):");
      if (studentCode) {
        studentCode = studentCode.trim().toUpperCase();
        localStorage.setItem('tibetan_student_code', studentCode);
      } else {
        studentCode = "GUEST";
      }
    }
    document.getElementById('display-student').innerText = studentCode;

    // Load original untouched exercise into iframe
    document.getElementById('exercise-frame').src = "./" + exerciseFilePath;

    // Extract Folder & File names for reporting
    const pathSegments = exerciseFilePath.split('/');
    const folderName = pathSegments.length > 1 ? pathSegments[0] : "Root";
    const fileName = pathSegments[pathSegments.length - 1];

    // 2. Active Participation Tracking Mechanics
    let activeSeconds = 0;
    let isIdle = false;
    let idleTimer;
    const IDLE_THRESHOLD_MS = 45000; // 45 seconds of no activity = pause counter

    function resetIdleTimer() {
      isIdle = false;
      document.getElementById('status-indicator').className = 'status-active';
      document.getElementById('status-indicator').innerText = '● Active';
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        isIdle = true;
        document.getElementById('status-indicator').className = 'status-idle';
        document.getElementById('status-indicator').innerText = '⏸ Paused (Idle)';
      }, IDLE_THRESHOLD_MS);
    }

    // Listen to user interactions anywhere on the parent window or iframe
    ['mousemove', 'keydown', 'click', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, resetIdleTimer);
    });

    // Also monitor activity inside the embedded iframe
    const iframe = document.getElementById('exercise-frame');
    iframe.addEventListener('load', () => {
      try {
        ['mousemove', 'keydown', 'click', 'touchstart'].forEach(evt => {
          iframe.contentWindow.addEventListener(evt, resetIdleTimer);
        });
      } catch (e) {
        // Fallback for cross-origin boundaries
      }
    });

    // Increment active seconds only if engaged and tab is visible
    setInterval(() => {
      if (!isIdle && document.visibilityState === 'visible') {
        activeSeconds++;
        const mins = Math.floor(activeSeconds / 60);
        const secs = activeSeconds % 60;
        document.getElementById('display-time').innerText = `${mins}m ${secs}s`;
      }
    }, 1000);

    // 3. Submit Session Data to Google Sheet
    function submitSession() {
      const mins = Math.floor(activeSeconds / 60);
      const secs = activeSeconds % 60;
      const timeFormatted = `${mins}m ${secs}s`;

      const payload = {
        studentCode: studentCode,
        folder: folderName,
        exercise: fileName,
        activeTime: timeFormatted,
        score: "Completed"
      };

      // Disable button during submit
      const btn = document.querySelector('.finish-btn');
      btn.innerText = "Submitting...";
      btn.disabled = true;

      fetch(GOOGLE_WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert(`Great job! Practice time logged: ${timeFormatted}`);
        window.location.href = "./index.html"; // Return to folder/main menu
      })
      .catch(err => {
        alert("Submitted! (Offline sync)");
        window.location.href = "./index.html";
      });
    }

    // Initialize idle timer
    resetIdleTimer();
  </script>
</body>
</html>
