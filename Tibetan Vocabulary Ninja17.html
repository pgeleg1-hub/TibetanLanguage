            const resetDefaultBtn = document.getElementById('reset-default-btn');
            if (resetDefaultBtn) resetDefaultBtn.onclick = resetVocabularyToDefault;

            const closeModalBtn = document.getElementById('close-modal-btn');
            if (closeModalBtn) closeModalBtn.onclick = closeModal;

            const cancelModalBtn = document.getElementById('cancel-modal-btn');
            if (cancelModalBtn) cancelModalBtn.onclick = closeModal;

            const addCatBtn = document.getElementById('add-category-btn');
            if (addCatBtn) addCatBtn.onclick = handleAddCategory;

            const editCatBtn = document.getElementById('edit-category-btn');
            if (editCatBtn) editCatBtn.onclick = handleEditCategory;

            const deleteCatBtn = document.getElementById('delete-category-btn');
            if (deleteCatBtn) deleteCatBtn.onclick = handleDeleteCategory;

            const exportCsvBtn = document.getElementById('export-csv-btn');
            if (exportCsvBtn) exportCsvBtn.onclick = exportCSVFile;

            const importCsvInput = document.getElementById('import-csv-input');
            if (importCsvInput) importCsvInput.onchange = importCSVFile;

            const restartQuizBtn = document.getElementById('restart-quiz-btn');
            if (restartQuizBtn) restartQuizBtn.onclick = () => initQuiz();

            const gotoManagerBtn = document.getElementById('goto-manager-from-complete-btn');
            if (gotoManagerBtn) gotoManagerBtn.onclick = () => switchView('manager');

            const exportLearnerBtn = document.getElementById('export-learner-btn');
            if (exportLearnerBtn) exportLearnerBtn.onclick = exportLearnerFile;

            const importHtmlInput = document.getElementById('import-html-input');
            if (importHtmlInput) importHtmlInput.onchange = importHTMLFile;

            const vocabSearch = document.getElementById('vocab-search');
            if (vocabSearch) {
                vocabSearch.oninput = (e) => renderVocabList(e.target.value);
            }

            const imageFileInput = document.getElementById('form-image-file');
            if (imageFileInput) {
                imageFileInput.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                            document.getElementById('form-image').value = evt.target.result;
                            const status = document.getElementById('image-upload-status');
                            if (status) status.innerText = file.name;
                        };
                        reader.readAsDataURL(file);
                    }
                };
            }

            const recordAudioBtn = document.getElementById('record-audio-btn');
            if (recordAudioBtn) {
                recordAudioBtn.onclick = async () => {
                    const recordText = document.getElementById('record-btn-text');
                    const statusText = document.getElementById('recording-status');
                    const playBtn = document.getElementById('play-recorded-audio-btn');

                    if (!isRecording) {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                            mediaRecorder = new MediaRecorder(stream);
                            audioChunks = [];

                            mediaRecorder.ondataavailable = event => {
                                if (event.data.size > 0) audioChunks.push(event.data);
                            };

                            mediaRecorder.onstop = () => {
                                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                                const reader = new FileReader();
                                reader.readAsDataURL(audioBlob);
                                reader.onloadend = () => {
                                    currentAudioBlobBase64 = reader.result;
                                    if (playBtn) playBtn.classList.remove('hidden');
                                    if (statusText) statusText.innerText = "Recording saved!";
                                };
                                stream.getTracks().forEach(track => track.stop());
                            };

                            mediaRecorder.start();
                            isRecording = true;
                            if (recordText) recordText.innerText = "Stop Recording";
                            if (statusText) statusText.innerText = "Recording...";
                        } catch (err) {
                            alert("Microphone permission required to record audio.");
                        }
                    } else {
                        mediaRecorder.stop();
                        isRecording = false;
                        if (recordText) recordText.innerText = "Record Pronunciation";
                    }
                };
            }

            const playAudioBtn = document.getElementById('play-recorded-audio-btn');
            if (playAudioBtn) {
                playAudioBtn.onclick = () => {
                    if (currentAudioBlobBase64) {
                        const audio = new Audio(currentAudioBlobBase64);
                        audio.play();
                    }
                };
            }

            const vocabForm = document.getElementById('vocab-form');
            if (vocabForm) {
                vocabForm.onsubmit = (e) => {
                    e.preventDefault();
                    const index = parseInt(document.getElementById('edit-vocab-index').value);
                    const existingItem = index !== -1 ? vocabulary[index] : {};

                    const newItem = {
                        category: document.getElementById('form-category-select').value || "General",
                        english: document.getElementById('form-english').value.trim(),
                        tibetan: document.getElementById('form-tibetan').value.trim(),
                        wylie: document.getElementById('form-wylie').value.trim(),
                        image: document.getElementById('form-image').value.trim() || 'https://placehold.co/150x150/f7f7f7/777777?text=No+Image',
                        audio: currentAudioBlobBase64 !== null ? currentAudioBlobBase64 : (existingItem.audio || null)
                    };

                    if (index === -1) {
                        vocabulary.push(newItem);
                    } else {
                        vocabulary[index] = newItem;
                    }

                    closeModal();
                    renderVocabList();
                    populateCategoryDropdown();
                };
            }

            if (vocabulary.length > 0) {
                initQuiz();
            }
        });
    </script>
