<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibetan Lingo - Learn Tibetan Vocabulary</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Serif Tibetan -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+Tibetan:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // LEARNER_FLAG_START
        window.isLearnerVersion = false;
        // LEARNER_FLAG_END

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        tibetan: ['"Noto Serif Tibetan"', 'serif'],
                    },
                    colors: {
                        duo: {
                            green: '#58cc02',
                            greenHover: '#46a302',
                            blue: '#1cb0f6',
                            blueHover: '#1899d6',
                            red: '#ff4b4b',
                            redHover: '#ea2b2b',
                            orange: '#ff9600',
                            yellow: '#ffc800',
                            grayBg: '#f7f7f7',
                            grayText: '#777777',
                            grayBorder: '#e5e5e5',
                            cardBorder: '#e5e5e5',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #4b4b4b; }
        .tibetan-font { font-family: 'Noto Serif Tibetan', serif; line-height: 1.4; }
        .duo-button { transition: all 0.1s ease; box-shadow: 0 4px 0 0 rgba(0, 0, 0, 0.15); }
        .duo-button:active { transform: translateY(4px); box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.15); }
        .choice-card { transition: all 0.15s ease; border-bottom-width: 4px; }
        .choice-card:hover { transform: translateY(-2px); }
        .blur-image { filter: blur(14px); opacity: 0.25; transition: filter 0.3s ease, opacity 0.3s ease; }
        .reveal-image { filter: blur(0px); opacity: 1; }
    </style>
</head>
<body class="h-full flex flex-col bg-white select-none">

    <!-- Header Navigation -->
    <header class="w-full border-b border-duo-grayBorder px-4 py-3 flex items-center justify-between max-w-4xl mx-auto flex-wrap gap-y-2">
        <div class="flex items-center space-x-2 sm:space-x-3 flex-wrap gap-y-1">
            <button id="close-btn" class="text-gray-400 hover:text-gray-600 text-xl font-bold px-2 py-1 rounded-lg transition" title="Go to Manager">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <button id="quiz-reset-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-2.5 py-1.5 rounded-xl font-bold text-xs flex items-center space-x-1 border border-gray-300 transition" title="Reset Quiz Session">
                <i class="fa-solid fa-rotate-left"></i>
                <span class="hidden sm:inline">Reset</span>
            </button>
            
            <!-- Category Filter Selector -->
            <div class="relative">
                <select id="category-filter-select" class="bg-sky-50 border border-duo-blue text-duo-blue font-bold text-xs rounded-xl px-2.5 py-1.5 focus:outline-none cursor-pointer">
                    <option value="ALL">All Categories</option>
                </select>
            </div>

            <!-- Session Size Selector -->
            <div class="relative">
                <select id="session-size-select" class="bg-amber-50 border border-duo-orange text-duo-orange font-bold text-xs rounded-xl px-2.5 py-1.5 focus:outline-none cursor-pointer">
                    <option value="6">Quick 6</option>
                    <option value="12">Quick 12</option>
                    <option value="18">Quick 18</option>
                    <option value="ALL">Full Deck</option>
                </select>
            </div>

            <!-- Card Choices Count Selector -->
            <div class="relative">
                <select id="card-count-select" class="bg-emerald-50 border border-duo-green text-duo-green font-bold text-xs rounded-xl px-2.5 py-1.5 focus:outline-none cursor-pointer" title="Number of Choice Cards per Question">
                    <option value="3">3 Cards</option>
                    <option value="4">4 Cards</option>
                    <option value="6">6 Cards</option>
                </select>
            </div>

            <!-- Toggle Wylie Transliteration -->
            <button id="toggle-wylie-btn" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-bold text-xs rounded-xl px-2.5 py-1.5 transition flex items-center space-x-1" title="Toggle Wylie Transliteration On/Off">
                <i class="fa-solid fa-font"></i>
                <span id="wylie-btn-text">Wylie: ON</span>
            </button>

            <!-- Toggle Voice / Audio Sound -->
            <button id="toggle-audio-btn" class="bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 font-bold text-xs rounded-xl px-2.5 py-1.5 transition flex items-center space-x-1" title="Toggle Sound / Voice On/Off">
                <i id="audio-btn-icon" class="fa-solid fa-volume-high"></i>
                <span id="audio-btn-text">Voice: ON</span>
            </button>

            <div class="w-20 sm:w-32 md:w-48 bg-duo-grayBorder h-4 rounded-full overflow-hidden relative shrink-0">
                <div id="progress-bar" class="bg-duo-green h-full rounded-full transition-all duration-300" style="width: 0%;"></div>
            </div>
        </div>

        <div class="flex items-center space-x-3 sm:space-x-5">
            <!-- Current Stage Selector / Indicator -->
            <div class="relative flex items-center space-x-1 font-bold text-purple-600 bg-purple-50 border border-purple-200 px-2.5 py-1 rounded-xl text-xs sm:text-sm">
                <i class="fa-solid fa-layer-group"></i>
                <select id="stage-select" class="bg-transparent font-bold focus:outline-none cursor-pointer">
                    <option value="1">Stage 1</option>
                    <option value="2">Stage 2</option>
                    <option value="3">Stage 3</option>
                    <option value="4">Bonus Stage</option>
                </select>
            </div>

            <div class="flex items-center space-x-1 font-bold text-duo-red">
                <i class="fa-solid fa-heart text-xl animate-pulse"></i>
                <span id="lives-count" class="text-lg">5</span>
            </div>
            <div class="flex items-center space-x-1 font-bold text-duo-orange">
                <i class="fa-solid fa-fire text-xl"></i>
                <span id="streak-count" class="text-lg">3</span>
            </div>
            <button id="nav-manage-btn" class="bg-duo-blue hover:bg-duo-blueHover text-white px-3.5 py-2 rounded-2xl font-bold text-sm duo-button flex items-center space-x-1.5">
                <i class="fa-solid fa-book-open"></i>
                <span class="hidden sm:inline">Manage Vocab</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col justify-between max-w-2xl w-full mx-auto p-4 sm:p-6 overflow-y-auto">
        
        <!-- QUIZ VIEW -->
        <div id="quiz-view" class="flex-1 flex flex-col justify-between">
            <div id="quiz-inner-content">
                <div class="mb-6 flex items-center justify-between">
                    <div>
                        <div class="inline-flex items-center space-x-1.5 text-xs font-bold uppercase tracking-wider text-purple-600 bg-purple-100 px-2.5 py-1 rounded-full mb-3">
                            <i class="fa-solid fa-layer-group"></i>
                            <span id="question-badge">New Word</span>
                        </div>
                        <h2 id="question-prompt" class="text-2xl sm:text-3xl font-extrabold text-gray-800">
                            Which one of these is “milk”?
                        </h2>
                    </div>
                    <button id="speak-target-btn" class="bg-sky-100 hover:bg-sky-200 text-duo-blue w-12 h-12 rounded-2xl flex items-center justify-center text-xl transition shrink-0 ml-3 shadow-sm" title="Listen to pronunciation">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>

                <div id="choices-grid" class="grid gap-4 mb-6"></div>
            </div>

            <div id="feedback-footer" class="hidden border-t-2 border-gray-200 py-4 px-2 sm:px-6 flex flex-col sm:flex-row items-center justify-between rounded-t-2xl transition-all">
                <div id="feedback-msg" class="flex items-center space-x-3 mb-3 sm:mb-0"></div>
                <button id="next-btn" class="w-full sm:w-auto px-8 py-3 rounded-2xl font-bold text-white uppercase tracking-wider duo-button text-lg">
                    Continue
                </button>
            </div>
        </div>

        <!-- VOCABULARY MANAGER VIEW -->
        <div id="manager-view" class="hidden flex-1 flex flex-col">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4 gap-3">
                <div>
                    <h2 class="text-2xl font-extrabold text-gray-800">Vocabulary Manager</h2>
                    <p class="text-sm text-gray-500">Add, edit, assign categories, upload audio, reset, CSV import/export, or restore backups.</p>
                </div>
                <div class="flex items-center space-x-2 flex-wrap gap-y-2">
                    <button id="open-add-modal-btn" class="bg-duo-green hover:bg-duo-greenHover text-white px-3.5 py-2 rounded-2xl font-bold text-sm duo-button flex items-center space-x-1.5 shrink-0">
                        <i class="fa-solid fa-plus"></i>
                        <span>Add Word</span>
                    </button>
                    <button id="reset-default-btn" class="bg-duo-red hover:bg-duo-redHover text-white px-3.5 py-2 rounded-2xl font-bold text-sm duo-button flex items-center space-x-1.5 shrink-0" title="Reset to default words">
                        <i class="fa-solid fa-rotate-left"></i>
                        <span>Reset Defaults</span>
                    </button>
                    <label class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-2xl font-bold text-sm duo-button flex items-center space-x-1.5 shrink-0 cursor-pointer" title="Upload CSV file with text vocabulary data">
                        <i class="fa-solid fa-file-csv"></i>
                        <span>Upload CSV</span>
                        <input type="file" id="import-csv-input" accept=".csv,.txt" class="hidden">
                    </label>
                    <button id="export-csv-btn" class="bg-teal-600 hover:bg-teal-700 text-white px-3.5 py-2 rounded-2xl font-bold text-sm duo-button flex items-center space-x-1.5 shrink-0" title="Download vocabulary as CSV file">
                        <i class="fa-solid fa-file-excel"></i>
                        <span>Export CSV</span>
                    </button>
                    <label class="bg-sky-600 hover:bg-sky-700 text-white px-3.5 py-2 rounded-2xl font-bold text-sm duo-button flex items-center space-x-1.5 shrink-0 cursor-pointer" title="Upload a backup HTML or JSON file to replace current vocabulary">
                        <i class="fa-solid fa-upload"></i>
                        <span>Upload Backup</span>
                        <input type="file" id="import-html-input" accept=".html,.json" class="hidden">
                    </label>
                    <button id="export-learner-btn" class="bg-purple-600 hover:bg-purple-700 text-white px-3.5 py-2 rounded-2xl font-bold text-sm duo-button flex items-center space-x-1.5 shrink-0">
                        <i class="fa-solid fa-download"></i>
                        <span>Export Quiz</span>
                    </button>
                </div>
            </div>

            <div class="mb-4 flex items-center justify-between gap-2">
                <div class="relative w-full max-w-xs">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="vocab-search" placeholder="Search English, Tibetan, Category..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:border-duo-blue">
                </div>
                <button id="back-to-quiz-btn" class="bg-duo-blue hover:bg-duo-blueHover text-white px-4 py-2 rounded-xl font-bold text-sm transition flex items-center space-x-1.5 shrink-0">
                    <i class="fa-solid fa-arrow-left"></i> 
                    <span>Back to Quiz</span>
                </button>
            </div>

            <div id="vocab-list-container" class="flex-1 overflow-y-auto space-y-3 pr-1 max-h-[55vh]"></div>
        </div>

        <!-- END OF GAME STATS SCREEN -->
        <div id="completion-view" class="hidden flex-1 flex flex-col items-center justify-center text-center py-6">
            <div id="completion-icon-container" class="w-28 h-28 rounded-full flex items-center justify-center text-white text-5xl mb-4 shadow-lg animate-bounce"></div>
            
            <h2 id="completion-title" class="text-3xl font-extrabold text-gray-800 mb-1"></h2>
            <p id="completion-subtitle" class="text-gray-500 mb-6 max-w-sm text-sm"></p>

            <div class="grid grid-cols-3 gap-3 w-full max-w-sm mb-6">
                <div class="bg-green-50 border-2 border-green-200 rounded-2xl p-3 flex flex-col items-center">
                    <span class="text-xs font-bold text-green-600 uppercase">Correct</span>
                    <span id="stat-correct-count" class="text-2xl font-extrabold text-green-700">0</span>
                </div>
                <div class="bg-red-50 border-2 border-red-200 rounded-2xl p-3 flex flex-col items-center">
                    <span class="text-xs font-bold text-red-600 uppercase">Wrong</span>
                    <span id="stat-wrong-count" class="text-2xl font-extrabold text-red-700">0</span>
                </div>
                <div class="bg-sky-50 border-2 border-sky-200 rounded-2xl p-3 flex flex-col items-center">
                    <span class="text-xs font-bold text-sky-600 uppercase">Accuracy</span>
                    <span id="stat-accuracy-percent" class="text-2xl font-extrabold text-sky-700">0%</span>
                </div>
            </div>

            <!-- MISSED WORDS REVIEW CONTAINER -->
            <div id="missed-words-container" class="w-full max-w-md mb-6 hidden">
                <h3 class="text-xs font-bold text-red-600 uppercase tracking-wider mb-2 text-left flex items-center gap-1.5">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Words to Practice More:</span>
                </h3>
                <div id="missed-words-grid" class="grid grid-cols-2 gap-3"></div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 w-full max-w-xs justify-center">
                <button id="restart-quiz-btn" class="bg-duo-green hover:bg-duo-greenHover text-white font-bold py-3 px-6 rounded-2xl duo-button text-base w-full">
                    Try Again
                </button>
            </div>
        </div>

    </main>

    <!-- Modal Form -->
    <div id="vocab-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-gray-100 transform transition-all max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 id="modal-title" class="text-xl font-extrabold text-gray-800">Add New Vocabulary</h3>
                <button id="close-modal-btn" class="text-gray-400 hover:text-gray-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="vocab-form" class="space-y-3.5">
                <input type="hidden" id="edit-vocab-index" value="-1">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Category</label>
                    <div class="flex items-center space-x-2">
                        <select id="form-category-select" required class="flex-1 px-3 py-2 border border-gray-300 rounded-xl focus:outline-none focus:border-duo-blue font-medium text-sm bg-white cursor-pointer">
                            <!-- Populated dynamically via JS -->
                        </select>
                        <button type="button" id="add-category-btn" class="bg-duo-green hover:bg-duo-greenHover text-white px-3 py-2 rounded-xl text-xs font-bold shrink-0 transition" title="Add New Category">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                        <button type="button" id="edit-category-btn" class="bg-sky-100 hover:bg-sky-200 text-duo-blue px-3 py-2 rounded-xl text-xs font-bold shrink-0 transition" title="Edit Selected Category">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button type="button" id="delete-category-btn" class="bg-red-100 hover:bg-red-200 text-duo-red px-3 py-2 rounded-xl text-xs font-bold shrink-0 transition" title="Delete Selected Category">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">English Meaning</label>
                    <input type="text" id="form-english" required placeholder="e.g. Milk" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:border-duo-blue font-medium text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Tibetan Word (Script)</label>
                    <input type="text" id="form-tibetan" required placeholder="e.g. འོ་མ" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:border-duo-blue tibetan-font text-lg font-bold">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Wylie Transliteration</label>
                    <input type="text" id="form-wylie" required placeholder="e.g. 'o ma" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:border-duo-blue font-medium text-sm">
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Image Source</label>
                    <input type="text" id="form-image" placeholder="Image URL or upload below" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:border-duo-blue text-sm mb-2">
                    <div class="flex items-center justify-between gap-2">
                        <label class="flex-1 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded-xl px-3 py-2 text-xs font-bold text-gray-700 text-center cursor-pointer transition">
                            <i class="fa-solid fa-upload mr-1"></i> Upload Image File
                            <input type="file" id="form-image-file" accept="image/*" class="hidden">
                        </label>
                        <span id="image-upload-status" class="text-xs text-gray-500 truncate max-w-[150px]"></span>
                    </div>
                </div>

                <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3">
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Custom Voice Recording</label>
                    <div class="flex items-center space-x-2">
                        <button type="button" id="record-audio-btn" class="bg-duo-red hover:bg-duo-redHover text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 transition">
                            <i class="fa-solid fa-microphone"></i>
                            <span id="record-btn-text">Record Pronunciation</span>
                        </button>
                        <button type="button" id="play-recorded-audio-btn" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 transition">
                            <i class="fa-solid fa-play"></i>
                            <span>Preview</span>
                        </button>
                        <span id="recording-status" class="text-xs font-medium text-gray-500 italic">No recording</span>
                    </div>
                </div>

                <div class="flex space-x-3 pt-2">
                    <button type="button" id="cancel-modal-btn" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-2xl transition">Cancel</button>
                    <button type="submit" class="w-1/2 bg-duo-green hover:bg-duo-greenHover text-white font-bold py-3 rounded-2xl duo-button">Save Word</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const initialDefaultVocab = [
            { category: "Food & Drink", english: "Milk", tibetan: "འོ་མ", wylie: "'o ma", image: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400&auto=format&fit=crop&q=80", audio: null },
            { category: "Food & Drink", english: "Water", tibetan: "ཆུ", wylie: "chu", image: "https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=400&auto=format&fit=crop&q=80", audio: null },
            { category: "Food & Drink", english: "Tea", tibetan: "ཇ", wylie: "ja", image: "https://images.unsplash.com/photo-1559181567-c3190ca9959b?w=400&auto=format&fit=crop&q=80", audio: null },
            { category: "Fruits", english: "Apple", tibetan: "ཀུ་ཤུ", wylie: "ku shu", image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400&auto=format&fit=crop&q=80", audio: null },
            { category: "Food & Drink", english: "Bread", tibetan: "ཞིབ་ལ", wylie: "zhib la", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400&auto=format&fit=crop&q=80", audio: null },
            { category: "Household", english: "Book", tibetan: "དེབ་", wylie: "deb", image: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&auto=format&fit=crop&q=80", audio: null }
        ];

        // EMBEDDED_VOCABULARY_START
        let vocabulary = [
            { category: "Food & Drink", english: "Milk", tibetan: "འོ་མ", wylie: "'o ma", image: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400&auto=format&fit=crop&q=80", audio: null },
            { category: "Food & Drink", english: "Water", tibetan: "ཆུ", wylie: "chu", image: "https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=400&auto=format&fit=crop&q=80", audio: null },
            { category: "Food & Drink", english: "Tea", tibetan: "ཇ", wylie: "ja", image: "https://images.unsplash.com/photo-1559181567-c3190ca9959b?w=400&auto=format&fit=crop&q=80", audio: null },
            { category: "Fruits", english: "Apple", tibetan: "ཀུ་ཤུ", wylie: "ku shu", image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400&auto=format&fit=crop&q=80", audio: null },
            { category: "Food & Drink", english: "Bread", tibetan: "ཞིབ་ལ", wylie: "zhib la", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400&auto=format&fit=crop&q=80", audio: null },
            { category: "Household", english: "Book", tibetan: "དེབ་", wylie: "deb", image: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&auto=format&fit=crop&q=80", audio: null }
        ];
        // EMBEDDED_VOCABULARY_END

        let currentStage = 1;
        let lives = 5;
        let streak = 3;
        let currentQuestionIndex = 0;
        let quizQuestions = [];
        let selectedCardIndex = null;
        let currentCorrectAnswerIndex = null;
        let isAnswerChecked = false;
        let currentAudioBlobBase64 = null;
        let selectedCategory = "ALL";
        let selectedSessionSize = "6";
        let selectedCardCount = "3";

        // Global Toggles
        let showWylie = true;
        let isAudioEnabled = true;

        let correctAnswersCount = 0;
        let wrongAnswersCount = 0;
        let missedWords = [];

        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        function purgeManagerElementsIfLearner() {
            if (window.isLearnerVersion) {
                const elementsToRemove = [
                    'close-btn',
                    'nav-manage-btn',
                    'manager-view',
                    'vocab-modal',
                    'goto-manager-from-complete-btn'
                ];
                elementsToRemove.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.remove();
                });
            }
        }

        function populateCategoryDropdown() {
            const select = document.getElementById('category-filter-select');
            const formSelect = document.getElementById('form-category-select');

            const categories = Array.from(new Set(vocabulary.map(v => v.category || "General"))).sort();
            if (!categories.includes("General")) categories.unshift("General");

            if (select) {
                select.innerHTML = '<option value="ALL">All Categories</option>';
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.innerText = cat;
                    select.appendChild(opt);
                });
                select.value = selectedCategory;
            }

            if (formSelect) {
                const currentVal = formSelect.value;
                formSelect.innerHTML = '';
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.innerText = cat;
                    formSelect.appendChild(opt);
                });
                if (categories.includes(currentVal)) {
                    formSelect.value = currentVal;
                }
            }
        }

        function playWordAudio(vocabItem, isManualClick = false) {
            if (!isAudioEnabled && !isManualClick) return;

            if (vocabItem && vocabItem.audio) {
                try {
                    const audio = new Audio(vocabItem.audio);
                    audio.play().catch(e => console.log("Custom audio playback error", e));
                    return;
                } catch (err) {
                    console.log("Audio fallback error", err);
                }
            }

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const voices = window.speechSynthesis.getVoices();
                const tibetanVoiceExists = voices.some(v => v.lang.includes('bo'));

                if (tibetanVoiceExists) {
                    const utterance = new SpeechSynthesisUtterance(vocabItem.tibetan);
                    utterance.lang = 'bo-CN';
                    utterance.rate = 0.8;
                    window.speechSynthesis.speak(utterance);
                } else {
                    const fallbackUtterance = new SpeechSynthesisUtterance(vocabItem.english);
                    fallbackUtterance.lang = 'en-US';
                    fallbackUtterance.rate = 0.9;
                    window.speechSynthesis.speak(fallbackUtterance);
                }
            }
        }

        function toggleWylie() {
            showWylie = !showWylie;
            const btnText = document.getElementById('wylie-btn-text');
            const btn = document.getElementById('toggle-wylie-btn');

            if (btnText) btnText.innerText = `Wylie: ${showWylie ? 'ON' : 'OFF'}`;
            if (btn) {
                if (showWylie) {
                    btn.className = "bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-bold text-xs rounded-xl px-2.5 py-1.5 transition flex items-center space-x-1";
                } else {
                    btn.className = "bg-gray-100 hover:bg-gray-200 text-gray-500 border border-gray-300 font-bold text-xs rounded-xl px-2.5 py-1.5 transition flex items-center space-x-1";
                }
            }

            // Update Wylie visibility in place across Quiz prompt, choice cards, Completion screen, and Manager list
            const currentWord = quizQuestions[currentQuestionIndex];
            if (currentWord && currentStage === 4) {
                const promptEl = document.getElementById('question-prompt');
                if (promptEl) {
                    const wyliePromptSpan = showWylie ? `<span class="prompt-wylie text-lg font-normal text-indigo-600 ml-1">(${currentWord.wylie})</span>` : '<span class="prompt-wylie hidden"></span>';
                    promptEl.innerHTML = `Which one of these is <span class="text-duo-blue tibetan-font font-bold">“${currentWord.tibetan}”</span>${wyliePromptSpan}?`;
                }
            }

            const wylieElements = document.querySelectorAll('.choice-wylie, .prompt-wylie');
            wylieElements.forEach(el => {
                if (showWylie) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            });

            const managerView = document.getElementById('manager-view');
            if (managerView && !managerView.classList.contains('hidden')) {
                const vocabSearch = document.getElementById('vocab-search');
                renderVocabList(vocabSearch ? vocabSearch.value : '');
            }
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            const btnText = document.getElementById('audio-btn-text');
            const btnIcon = document.getElementById('audio-btn-icon');
            const btn = document.getElementById('toggle-audio-btn');

            if (btnText) btnText.innerText = `Voice: ${isAudioEnabled ? 'ON' : 'OFF'}`;
            if (btnIcon) btnIcon.className = isAudioEnabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark";
            if (btn) {
                if (isAudioEnabled) {
                    btn.className = "bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 font-bold text-xs rounded-xl px-2.5 py-1.5 transition flex items-center space-x-1";
                } else {
                    btn.className = "bg-gray-100 hover:bg-gray-200 text-gray-500 border border-gray-300 font-bold text-xs rounded-xl px-2.5 py-1.5 transition flex items-center space-x-1";
                }
            }
        }

        function switchView(target) {
            if (window.isLearnerVersion && target === 'manager') return;

            const quizView = document.getElementById('quiz-view');
            const managerView = document.getElementById('manager-view');
            const completionView = document.getElementById('completion-view');

            if (quizView) quizView.classList.add('hidden');
            if (managerView) managerView.classList.add('hidden');
            if (completionView) completionView.classList.add('hidden');

            if (target === 'quiz' && quizView) {
                quizView.classList.remove('hidden');
            } else if (target === 'manager' && managerView) {
                managerView.classList.remove('hidden');
                renderVocabList();
            } else if (target === 'completion' && completionView) {
                completionView.classList.remove('hidden');
            }
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initQuiz() {
            populateCategoryDropdown();

            let activePool = vocabulary;
            if (selectedCategory !== "ALL") {
                activePool = vocabulary.filter(item => (item.category || "General") === selectedCategory);
            }

            const minRequiredCards = parseInt(selectedCardCount);
            if (activePool.length < minRequiredCards) {
                alert(`Not enough words in "${selectedCategory}" for a ${minRequiredCards}-card quiz! Switched to All Categories.`);
                selectedCategory = "ALL";
                document.getElementById('category-filter-select').value = "ALL";
                activePool = vocabulary;
            }

            let questionCount = activePool.length;
            if (selectedSessionSize !== "ALL") {
                const requestedSize = parseInt(selectedSessionSize);
                questionCount = Math.min(activePool.length, requestedSize);
            }

            quizQuestions = shuffleArray(activePool).slice(0, questionCount);
            currentQuestionIndex = 0;
            lives = 5;
            correctAnswersCount = 0;
            wrongAnswersCount = 0;
            missedWords = [];

            updateStatsUI();
            switchView('quiz');
            loadQuestion();
        }

        function loadQuestion() {
            isAnswerChecked = false;
            selectedCardIndex = null;
            const feedbackFooter = document.getElementById('feedback-footer');
            if (feedbackFooter) feedbackFooter.classList.add('hidden');
            
            const currentWord = quizQuestions[currentQuestionIndex];
            if (!currentWord) {
                showEndGameScreen();
                return;
            }
            
            const progressBar = document.getElementById('progress-bar');
            if (progressBar) {
                const progressPercent = (currentQuestionIndex / quizQuestions.length) * 100;
                progressBar.style.width = `${progressPercent}%`;
            }

            const promptEl = document.getElementById('question-prompt');
            if (promptEl) {
                if (currentStage === 4) {
                    const wyliePromptSpan = showWylie ? `<span class="prompt-wylie text-lg font-normal text-indigo-600 ml-1">(${currentWord.wylie})</span>` : '<span class="prompt-wylie hidden"></span>';
                    promptEl.innerHTML = `Which one of these is <span class="text-duo-blue tibetan-font font-bold">“${currentWord.tibetan}”</span>${wyliePromptSpan}?`;
                } else {
                    promptEl.innerHTML = `Which one of these is <span class="text-duo-blue">“${currentWord.english}”</span>?`;
                }
            }

            const badgeEl = document.getElementById('question-badge');
            if (badgeEl) {
                const catTag = currentWord.category ? ` • ${currentWord.category}` : '';
                badgeEl.innerText = `Word ${currentQuestionIndex + 1} of ${quizQuestions.length}${catTag}`;
            }

            const speakBtn = document.getElementById('speak-target-btn');
            if (speakBtn) {
                speakBtn.onclick = () => playWordAudio(currentWord, true);
            }

            const targetCardCount = parseInt(selectedCardCount);
            let poolForDistractors = vocabulary;
            if (selectedCategory !== "ALL") {
                poolForDistractors = vocabulary.filter(item => (item.category || "General") === selectedCategory);
            }
            let distractors = poolForDistractors.filter(item => item.english !== currentWord.english);
            distractors = shuffleArray(distractors).slice(0, Math.max(1, targetCardCount - 1));
            let choices = shuffleArray([currentWord, ...distractors]);
            
            currentCorrectAnswerIndex = choices.findIndex(item => item.english === currentWord.english);

            const choicesGrid = document.getElementById('choices-grid');
            if (!choicesGrid) return;

            if (targetCardCount === 4) {
                choicesGrid.className = "grid grid-cols-2 gap-4 mb-6";
            } else if (targetCardCount === 6) {
                choicesGrid.className = "grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6";
            } else {
                choicesGrid.className = "grid grid-cols-2 sm:grid-cols-3 gap-4 mb-6";
            }

            choicesGrid.innerHTML = '';
            choices.forEach((choice, index) => {
                const card = document.createElement('div');
                const cardMinHeightClass = targetCardCount === 6 ? 'min-h-[12rem]' : 'min-h-[14rem]';
                card.className = `choice-card bg-white border-2 border-duo-cardBorder rounded-2xl p-3 sm:p-4 flex flex-col items-center justify-center gap-1 cursor-pointer shadow-sm hover:border-duo-blue select-none relative h-auto ${cardMinHeightClass}`;
                card.dataset.index = index;
                
                let imageContainerHTML = '';
                let voiceBtnHTML = '';

                if (currentStage === 1 || currentStage === 4) {
                    const imgSizeClass = targetCardCount === 6 ? 'w-20 h-20' : 'w-24 h-24 sm:w-28 sm:h-28';
                    if (currentStage !== 4) {
                        voiceBtnHTML = `
                            <button type="button" class="img-voice-btn absolute top-2 right-2 bg-white/90 hover:bg-sky-100 text-duo-blue w-6 h-6 sm:w-7 sm:h-7 rounded-lg flex items-center justify-center text-xs shadow-md transition z-20 border border-gray-200" title="Listen to pronunciation">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        `;
                    }
                    imageContainerHTML = `
                        <div class="${imgSizeClass} my-1 flex items-center justify-center overflow-hidden rounded-xl relative bg-gray-50 border border-gray-100 shrink-0">
                            <img src="${choice.image}" alt="${choice.english}" class="choice-img w-full h-full object-cover rounded-xl reveal-image" onerror="this.src='https://placehold.co/150x150/f7f7f7/777777?text=No+Image'">
                        </div>
                    `;
                }

                let textContainerClass = "text-center w-full mt-1 flex flex-col items-center justify-center";
                if (currentStage === 2 || currentStage === 3) {
                    textContainerClass = "text-center w-full my-auto flex flex-col items-center justify-center";
                }

                const wylieHiddenClass = showWylie ? '' : 'hidden';
                const wylieHTML = `<div class="choice-wylie text-[11px] sm:text-sm font-medium text-gray-400 mt-0.5 ${wylieHiddenClass}">${choice.wylie}</div>`;

                if (currentStage === 4) {
                    card.innerHTML = `
                        <div class="absolute top-2 left-2 w-6 h-6 sm:w-7 sm:h-7 rounded-full border-2 border-gray-300 flex items-center justify-center text-xs font-bold text-gray-400 choice-number z-10">
                            ${index + 1}
                        </div>
                        ${voiceBtnHTML}
                        ${imageContainerHTML}
                        <div class="${textContainerClass}">
                            <div class="text-lg sm:text-2xl font-bold text-gray-800 leading-tight pt-1">${choice.english}</div>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="absolute top-2 left-2 w-6 h-6 sm:w-7 sm:h-7 rounded-full border-2 border-gray-300 flex items-center justify-center text-xs font-bold text-gray-400 choice-number z-10">
                            ${index + 1}
                        </div>
                        ${voiceBtnHTML}
                        ${imageContainerHTML}
                        <div class="${textContainerClass}">
                            <div class="tibetan-font text-lg sm:text-2xl font-bold text-gray-800 pt-1 sm:pt-2">${choice.tibetan}</div>
                            ${wylieHTML}
                        </div>
                    `;
                }

                const imgVoiceBtn = card.querySelector('.img-voice-btn');
                if (imgVoiceBtn) {
                    imgVoiceBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        playWordAudio(choice, true);
                    });
                }

                card.addEventListener('click', () => {
                    if (currentStage !== 3 && currentStage !== 4) {
                        playWordAudio(choice);
                    }
                    selectCard(index);
                });

                choicesGrid.appendChild(card);
            });
        }

        function selectCard(index) {
            if (isAnswerChecked) return;

            selectedCardIndex = index;
            const choicesGrid = document.getElementById('choices-grid');
            const cards = choicesGrid.querySelectorAll('.choice-card');
            
            cards.forEach((card, idx) => {
                const num = card.querySelector('.choice-number');
                if (idx === index) {
                    card.classList.remove('border-duo-cardBorder');
                    card.classList.add('border-duo-blue', 'bg-sky-50/50', 'ring-2', 'ring-duo-blue');
                    if (num) num.classList.add('bg-duo-blue', 'text-white', 'border-duo-blue');
                } else {
                    card.classList.remove('border-duo-blue', 'bg-sky-50/50', 'ring-2', 'ring-duo-blue');
                    card.classList.add('border-duo-cardBorder');
                    if (num) num.classList.remove('bg-duo-blue', 'text-white', 'border-duo-blue');
                }
            });

            const feedbackFooter = document.getElementById('feedback-footer');
            const feedbackMsg = document.getElementById('feedback-msg');
            const nextBtn = document.getElementById('next-btn');

            if (feedbackFooter) {
                feedbackFooter.classList.remove('hidden');
                feedbackFooter.className = "border-t-2 border-gray-200 py-4 px-2 sm:px-6 flex flex-col sm:flex-row items-center justify-between rounded-t-2xl bg-white";
            }
            if (feedbackMsg) {
                feedbackMsg.innerHTML = `
                    <div class="w-12 h-12 rounded-full bg-duo-blue text-white flex items-center justify-center text-xl font-bold">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div>
                        <h4 class="font-extrabold text-gray-800 text-lg">Ready to check?</h4>
                        <p class="text-sm text-gray-500">Tap check to confirm!</p>
                    </div>
                `;
            }
            if (nextBtn) {
                nextBtn.className = "w-full sm:w-auto px-8 py-3 rounded-2xl font-bold text-white uppercase tracking-wider duo-button text-lg bg-duo-green hover:bg-duo-greenHover";
                nextBtn.innerText = "CHECK";
            }
        }

        function handleNextButtonClick() {
            const feedbackFooter = document.getElementById('feedback-footer');
            const feedbackMsg = document.getElementById('feedback-msg');
            const nextBtn = document.getElementById('next-btn');

            if (selectedCardIndex === null && !isAnswerChecked) return;

            if (!isAnswerChecked) {
                isAnswerChecked = true;
                const isCorrect = (selectedCardIndex === currentCorrectAnswerIndex);
                
                const choicesGrid = document.getElementById('choices-grid');
                const cards = choicesGrid.querySelectorAll('.choice-card');
                
                cards.forEach((card, idx) => {
                    if (idx === currentCorrectAnswerIndex) {
                        card.classList.add('border-duo-green', 'bg-green-50', 'ring-2', 'ring-duo-green');
                    } else if (idx === selectedCardIndex && !isCorrect) {
                        card.classList.add('border-duo-red', 'bg-red-50', 'ring-2', 'ring-duo-red');
                    }
                });

                if (isCorrect) {
                    correctAnswersCount++;
                    if (feedbackFooter) feedbackFooter.className = "border-t-2 border-green-200 py-4 px-2 sm:px-6 flex flex-col sm:flex-row items-center justify-between rounded-t-2xl bg-green-50 transition-all";
                    if (feedbackMsg) {
                        feedbackMsg.innerHTML = `
                            <div class="w-12 h-12 rounded-full bg-duo-green text-white flex items-center justify-center text-xl font-bold animate-bounce">
                                <i class="fa-solid fa-check"></i>
                            </div>
                            <div>
                                <h4 class="font-extrabold text-green-700 text-lg">Correct! Great job!</h4>
                                <p class="text-sm text-green-600">You are mastering Tibetan vocabulary.</p>
                            </div>
                        `;
                    }
                    if (nextBtn) {
                        nextBtn.className = "w-full sm:w-auto px-8 py-3 rounded-2xl font-bold text-white uppercase tracking-wider duo-button text-lg bg-duo-green hover:bg-duo-greenHover";
                    }
                } else {
                    wrongAnswersCount++;
                    const targetWord = quizQuestions[currentQuestionIndex];
                    if (targetWord && !missedWords.some(w => w.english === targetWord.english)) {
                        missedWords.push(targetWord);
                    }

                    lives = Math.max(0, lives - 1);
                    updateStatsUI();
                    if (feedbackFooter) feedbackFooter.className = "border-t-2 border-red-200 py-4 px-2 sm:px-6 flex flex-col sm:flex-row items-center justify-between rounded-t-2xl bg-red-50 transition-all";
                    if (feedbackMsg) {
                        feedbackMsg.innerHTML = `
                            <div class="w-12 h-12 rounded-full bg-duo-red text-white flex items-center justify-center text-xl font-bold">
                                <i class="fa-solid fa-xmark"></i>
                            </div>
                            <div>
                                <h4 class="font-extrabold text-red-700 text-lg">Correct answer shown above</h4>
                                <p class="text-sm text-red-600">Keep practicing to remember!</p>
                            </div>
                        `;
                    }
                    if (nextBtn) {
                        nextBtn.className = "w-full sm:w-auto px-8 py-3 rounded-2xl font-bold text-white uppercase tracking-wider duo-button text-lg bg-duo-red hover:bg-duo-redHover";
                    }
                }

                if (nextBtn) nextBtn.innerText = "CONTINUE";

                if (lives <= 0) {
                    setTimeout(() => {
                        showEndGameScreen();
                    }, 1200);
                }
            } else {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizQuestions.length && lives > 0) {
                    loadQuestion();
                } else {
                    showEndGameScreen();
                }
            }
        }

        function showEndGameScreen() {
            switchView('completion');
            const progressBar = document.getElementById('progress-bar');
            if (progressBar) progressBar.style.width = '100%';

            const totalQuestionsAttempted = correctAnswersCount + wrongAnswersCount;
            const accuracyPercent = totalQuestionsAttempted > 0 
                ? Math.round((correctAnswersCount / totalQuestionsAttempted) * 100) 
                : 0;

            const previousStage = currentStage;
            let isCompletedAll = false;

            if (accuracyPercent === 100) {
                if (currentStage < 4) {
                    currentStage++;
                } else if (currentStage === 4) {
                    isCompletedAll = true;
                    currentStage = 1; // Reset to Stage 1 after completing Bonus Stage
                }
            }

            if (accuracyPercent < 100 || wrongAnswersCount > 0) {
                streak = 0;
            } else if (lives > 0 && accuracyPercent === 100) {
                streak += 1;
            }

            updateStatsUI();

            const iconContainer = document.getElementById('completion-icon-container');
            const titleEl = document.getElementById('completion-title');
            const subtitleEl = document.getElementById('completion-subtitle');
            const restartBtn = document.getElementById('restart-quiz-btn');
            
            document.getElementById('stat-correct-count').innerText = correctAnswersCount;
            document.getElementById('stat-wrong-count').innerText = wrongAnswersCount;
            document.getElementById('stat-accuracy-percent').innerText = `${accuracyPercent}%`;

            // RENDER MISSED WORDS IN LESSON COMPLETE SCREEN
            const missedContainer = document.getElementById('missed-words-container');
            const missedGrid = document.getElementById('missed-words-grid');

            if (missedWords.length > 0 && missedContainer && missedGrid) {
                missedGrid.innerHTML = '';
                missedWords.forEach(word => {
                    const card = document.createElement('div');
                    card.className = "bg-red-50/60 border border-red-200 rounded-2xl p-3 flex flex-col items-center justify-between text-center shadow-sm relative";

                    const wylieHiddenClass = showWylie ? '' : 'hidden';
                    card.innerHTML = `
                        <div class="w-16 h-16 rounded-xl overflow-hidden bg-white border border-gray-200 mb-2 shrink-0 relative group">
                            <img src="${word.image}" alt="${word.english}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/150x150/f7f7f7/777777?text=No+Image'">
                        </div>
                        <div class="text-base font-extrabold text-gray-800 leading-tight">${word.english}</div>
                        <div class="tibetan-font text-xl font-bold text-gray-800 mt-1">${word.tibetan}</div>
                        <div class="choice-wylie text-xs font-medium text-gray-400 mt-0.5 ${wylieHiddenClass}">${word.wylie}</div>
                        <button type="button" class="missed-voice-btn mt-2 bg-white hover:bg-sky-100 text-duo-blue px-3 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1 border border-gray-200 shadow-sm transition" title="Listen to pronunciation">
                            <i class="fa-solid fa-volume-high"></i>
                            <span>Listen</span>
                        </button>
                    `;

                    const voiceBtn = card.querySelector('.missed-voice-btn');
                    if (voiceBtn) {
                        voiceBtn.onclick = () => playWordAudio(word, true);
                    }

                    missedGrid.appendChild(card);
                });
                missedContainer.classList.remove('hidden');
            } else if (missedContainer) {
                missedContainer.classList.add('hidden');
            }

            if (lives > 0 && accuracyPercent >= 60) {
                if (iconContainer) {
                    iconContainer.className = "w-28 h-28 bg-duo-yellow rounded-full flex items-center justify-center text-white text-5xl mb-4 shadow-lg animate-bounce";
                    iconContainer.innerHTML = '<i class="fa-solid fa-trophy"></i>';
                }
                if (titleEl) titleEl.innerText = "Lesson Complete!";
                if (subtitleEl) {
                    if (accuracyPercent === 100) {
                        if (isCompletedAll) {
                            subtitleEl.innerText = "You are Genius! Perfect score!";
                            if (restartBtn) restartBtn.innerText = "Practice Again";
                        } else if (previousStage === 3) {
                            subtitleEl.innerText = "Excellent! Perfect score! Moving to Bonus Stage!";
                            if (restartBtn) restartBtn.innerText = "Next Stage";
                        } else {
                            subtitleEl.innerText = `Perfect score! You completed Stage ${previousStage} and advanced to Stage ${currentStage}!`;
                            if (restartBtn) restartBtn.innerText = "Next Stage";
                        }
                    } else {
                        subtitleEl.innerText = "Good effort! You practiced your Tibetan vocabulary, but getting questions wrong broke your streak.";
                        if (restartBtn) restartBtn.innerText = "Try Again";
                    }
                }
            } else {
                if (iconContainer) {
                    iconContainer.className = "w-28 h-28 bg-duo-red rounded-full flex items-center justify-center text-white text-5xl mb-4 shadow-lg";
                    iconContainer.innerHTML = '<i class="fa-solid fa-heart-crack"></i>';
                }
                if (titleEl) titleEl.innerText = "Needs More Practice!";
                if (subtitleEl) subtitleEl.innerText = "Don't give up! Getting questions wrong broke your streak. Review your words and try again!";
                if (restartBtn) restartBtn.innerText = "Try Again";
            }
        }

        function updateStatsUI() {
            const livesEl = document.getElementById('lives-count');
            const streakEl = document.getElementById('streak-count');
            const stageSelect = document.getElementById('stage-select');
            const sessionSizeSelect = document.getElementById('session-size-select');
            const cardCountSelect = document.getElementById('card-count-select');
            if (livesEl) livesEl.innerText = lives;
            if (streakEl) streakEl.innerText = streak;
            if (stageSelect) stageSelect.value = currentStage;
            if (sessionSizeSelect) sessionSizeSelect.value = selectedSessionSize;
            if (cardCountSelect) cardCountSelect.value = selectedCardCount;
        }

        function renderVocabList(filter = '') {
            const container = document.getElementById('vocab-list-container');
            if (!container) return;

            container.innerHTML = '';
            const filtered = vocabulary.filter(item => 
                item.english.toLowerCase().includes(filter.toLowerCase()) ||
                item.tibetan.includes(filter) ||
                (item.category || '').toLowerCase().includes(filter.toLowerCase()) ||
                item.wylie.toLowerCase().includes(filter.toLowerCase())
            );

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-400">No vocabulary items found.</div>`;
                return;
            }

            filtered.forEach((item) => {
                const actualIndex = vocabulary.indexOf(item);
                const row = document.createElement('div');
                row.className = "flex items-center justify-between p-3.5 bg-white border border-gray-200 rounded-2xl shadow-sm hover:border-duo-blue transition";
                
                const wylieHTML = showWylie ? `<span class="text-xs text-gray-400 font-medium truncate">${item.wylie}</span>` : '';

                row.innerHTML = `
                    <div class="flex items-center space-x-4 cursor-pointer flex-1 mr-2 listen-row-btn" data-index="${actualIndex}" title="Click to listen">
                        <div class="w-12 h-12 rounded-xl overflow-hidden bg-gray-100 shrink-0 border relative group">
                            <img src="${item.image}" alt="${item.english}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/f7f7f7/777777?text=Img'">
                            <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 flex items-center justify-center text-white transition">
                                <i class="fa-solid fa-volume-high"></i>
                            </div>
                        </div>
                        <div class="min-w-0">
                            <div class="flex items-center space-x-2">
                                <span class="font-extrabold text-gray-800 text-base truncate">${item.english}</span>
                                <span class="text-[10px] bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded-full uppercase">${item.category || 'General'}</span>
                                ${item.audio ? '<span class="text-xs bg-green-100 text-green-700 px-1.5 py-0.5 rounded font-bold shrink-0"><i class="fa-solid fa-microphone text-[10px]"></i> Audio</span>' : ''}
                            </div>
                            <div class="flex items-center space-x-3 mt-0.5">
                                <span class="tibetan-font font-bold text-gray-700 text-lg">${item.tibetan}</span>
                                ${wylieHTML}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0">
                        <button class="edit-vocab-btn w-9 h-9 rounded-xl bg-gray-100 hover:bg-sky-100 hover:text-duo-blue text-gray-600 flex items-center justify-center transition" data-index="${actualIndex}" title="Edit">
                            <i class="fa-solid fa-pen text-sm"></i>
                        </button>
                        <button class="delete-vocab-btn w-9 h-9 rounded-xl bg-gray-100 hover:bg-red-100 hover:text-duo-red text-gray-600 flex items-center justify-center transition" data-index="${actualIndex}" title="Delete">
                            <i class="fa-solid fa-trash text-sm"></i>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });

            container.querySelectorAll('.listen-row-btn').forEach(btn => {
                btn.onclick = () => playWordAudio(vocabulary[parseInt(btn.dataset.index)], true);
            });
            container.querySelectorAll('.edit-vocab-btn').forEach(btn => {
                btn.onclick = () => openEditModal(parseInt(btn.dataset.index));
            });
            container.querySelectorAll('.delete-vocab-btn').forEach(btn => {
                btn.onclick = () => deleteVocabItem(parseInt(btn.dataset.index));
            });
        }

        function openEditModal(index = -1) {
            populateCategoryDropdown();

            const modal = document.getElementById('vocab-modal');
            const title = document.getElementById('modal-title');
            const editIndexInput = document.getElementById('edit-vocab-index');
            const form = document.getElementById('vocab-form');
            const playAudioBtn = document.getElementById('play-recorded-audio-btn');
            const recStatus = document.getElementById('recording-status');
            const imgStatus = document.getElementById('image-upload-status');

            if (!modal) return;

            if (form) form.reset();
            currentAudioBlobBase64 = null;
            if (playAudioBtn) playAudioBtn.classList.add('hidden');
            if (recStatus) recStatus.innerText = "No recording";
            if (imgStatus) imgStatus.innerText = "";

            if (index >= 0) {
                const item = vocabulary[index];
                if (title) title.innerText = "Edit Vocabulary";
                if (editIndexInput) editIndexInput.value = index;
                document.getElementById('form-category-select').value = item.category || "General";
                document.getElementById('form-english').value = item.english;
                document.getElementById('form-tibetan').value = item.tibetan;
                document.getElementById('form-wylie').value = item.wylie;
                document.getElementById('form-image').value = item.image;
                
                currentAudioBlobBase64 = item.audio || null;
                if (currentAudioBlobBase64) {
                    if (playAudioBtn) playAudioBtn.classList.remove('hidden');
                    if (recStatus) recStatus.innerText = "Has custom recording";
                }
            } else {
                if (title) title.innerText = "Add New Vocabulary";
                if (editIndexInput) editIndexInput.value = "-1";
                document.getElementById('form-category-select').value = "General";
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('vocab-modal');
            if (modal) modal.classList.add('hidden');
        }

        function handleAddCategory() {
            const newCat = prompt("Enter new category name:");
            if (newCat && newCat.trim() !== '') {
                const formatted = newCat.trim();
                populateCategoryDropdown();
                const formSelect = document.getElementById('form-category-select');
                if (formSelect) {
                    let optExists = false;
                    for (let opt of formSelect.options) {
                        if (opt.value.toLowerCase() === formatted.toLowerCase()) {
                            formSelect.value = opt.value;
                            optExists = true;
                            break;
                        }
                    }
                    if (!optExists) {
                        const opt = document.createElement('option');
                        opt.value = formatted;
                        opt.innerText = formatted;
                        formSelect.appendChild(opt);
                        formSelect.value = formatted;
                    }
                }
            }
        }

        function handleEditCategory() {
            const formSelect = document.getElementById('form-category-select');
            if (!formSelect) return;
            const oldCat = formSelect.value;
            if (!oldCat) return;

            const newCat = prompt(`Rename category "${oldCat}" to:`, oldCat);
            if (newCat && newCat.trim() !== '' && newCat.trim() !== oldCat) {
                const formatted = newCat.trim();
                vocabulary.forEach(item => {
                    if ((item.category || "General") === oldCat) {
                        item.category = formatted;
                    }
                });
                if (selectedCategory === oldCat) {
                    selectedCategory = formatted;
                }
                populateCategoryDropdown();
                formSelect.value = formatted;
                renderVocabList();
            }
        }

        function handleDeleteCategory() {
            const formSelect = document.getElementById('form-category-select');
            if (!formSelect) return;
            const targetCat = formSelect.value;
            if (!targetCat) return;

            if (targetCat === "General") {
                alert('The "General" category cannot be deleted.');
                return;
            }

            if (confirm(`Are you sure you want to delete category "${targetCat}"? All words in this category will be reassigned to "General".`)) {
                vocabulary.forEach(item => {
                    if (item.category === targetCat) {
                        item.category = "General";
                    }
                });
                if (selectedCategory === targetCat) {
                    selectedCategory = "ALL";
                }
                populateCategoryDropdown();
                formSelect.value = "General";
                renderVocabList();
            }
        }

        function exportCSVFile() {
            if (!vocabulary || vocabulary.length === 0) {
                alert("No vocabulary items to export!");
                return;
            }

            let csvContent = "Category,English,Tibetan,Wylie\n";
            vocabulary.forEach(item => {
                const cat = `"${(item.category || 'General').replace(/"/g, '""')}"`;
                const eng = `"${(item.english || '').replace(/"/g, '""')}"`;
                const tib = `"${(item.tibetan || '').replace(/"/g, '""')}"`;
                const wyl = `"${(item.wylie || '').replace(/"/g, '""')}"`;
                csvContent += `${cat},${eng},${tib},${wyl}\n`;
            });

            const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tibetan_vocabulary.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        function importCSVFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
                if (lines.length === 0) {
                    alert("The selected CSV file is empty.");
                    return;
                }

                let categoryIdx = 0, englishIdx = 1, tibetanIdx = 2, wylieIdx = 3;
                const firstLineCols = parseCSVLine(lines[0]);
                const lowerHeaders = firstLineCols.map(c => c.toLowerCase());
                
                let hasHeader = false;
                if (lowerHeaders.includes('english') || lowerHeaders.includes('tibetan')) {
                    hasHeader = true;
                    categoryIdx = lowerHeaders.indexOf('category') !== -1 ? lowerHeaders.indexOf('category') : 0;
                    englishIdx = lowerHeaders.indexOf('english') !== -1 ? lowerHeaders.indexOf('english') : 1;
                    tibetanIdx = lowerHeaders.indexOf('tibetan') !== -1 ? lowerHeaders.indexOf('tibetan') : 2;
                    wylieIdx = lowerHeaders.indexOf('wylie') !== -1 ? lowerHeaders.indexOf('wylie') : 3;
                }

                const isReplace = confirm(`Click OK to MERGE / UPDATE existing deck (retains all images and audio).\nClick Cancel to REPLACE the entire deck with this CSV.`);

                if (!isReplace) {
                    vocabulary = [];
                }

                let updatedCount = 0;
                let addedCount = 0;
                const startIndex = hasHeader ? 1 : 0;

                for (let i = startIndex; i < lines.length; i++) {
                    const cols = parseCSVLine(lines[i]);
                    if (cols.length < 2) continue;

                    const category = (cols[categoryIdx] || "General").replace(/^"|"$/g, '').trim() || "General";
                    const english = (cols[englishIdx] || "").replace(/^"|"$/g, '').trim();
                    const tibetan = (cols[tibetanIdx] || "").replace(/^"|"$/g, '').trim();
                    const wylie = (cols[wylieIdx] || "").replace(/^"|"$/g, '').trim();

                    if (english && tibetan) {
                        const existingIdx = vocabulary.findIndex(v => v.english.toLowerCase() === english.toLowerCase());
                        
                        if (existingIdx !== -1) {
                            vocabulary[existingIdx].category = category;
                            vocabulary[existingIdx].tibetan = tibetan;
                            vocabulary[existingIdx].wylie = wylie;
                            updatedCount++;
                        } else {
                            vocabulary.push({
                                category: category,
                                english: english,
                                tibetan: tibetan,
                                wylie: wylie,
                                image: 'https://placehold.co/150x150/f7f7f7/777777?text=No+Image',
                                audio: null
                            });
                            addedCount++;
                        }
                    }
                }

                if (addedCount > 0 || updatedCount > 0) {
                    renderVocabList();
                    populateCategoryDropdown();
                    alert(`CSV Import Complete!\n• Words Added: ${addedCount}\n• Words Updated (Images & Audio Retained): ${updatedCount}\n• Total Words: ${vocabulary.length}`);
                    initQuiz();
                } else {
                    alert("Could not find valid text vocabulary rows in the CSV file.");
                }

                event.target.value = '';
            };

            reader.readAsText(file, 'UTF-8');
        }

        function deleteVocabItem(index) {
            if (vocabulary.length <= 3) {
                alert("You need to keep at least 3 vocabulary words in your deck!");
                return;
            }
            if (confirm("Are you sure you want to delete this word?")) {
                vocabulary.splice(index, 1);
                renderVocabList();
                populateCategoryDropdown();
            }
        }

        function resetQuizProgressOnly() {
            if (confirm("Reset current quiz session progress?")) {
                streak = 0;
                lives = 5;
                initQuiz();
            }
        }

        function resetVocabularyToDefault() {
            if (confirm("Are you sure you want to reset your vocabulary deck back to default? All custom words will be lost.")) {
                vocabulary = JSON.parse(JSON.stringify(initialDefaultVocab));
                selectedCategory = "ALL";
                currentStage = 1;
                streak = 0;
                lives = 5;
                initQuiz();
            }
        }

        function exportLearnerFile() {
            const documentHTML = document.documentElement.outerHTML;
            
            const jsonString = JSON.stringify(vocabulary, null, 4);
            const scriptReplacement = `// EMBEDDED_VOCABULARY_START\n        let vocabulary = ${jsonString};\n        // EMBEDDED_VOCABULARY_END`;
            
            let finalHtml = "<!DOCTYPE html>\n" + documentHTML.replace(
                /\/\/\s*EMBEDDED_VOCABULARY_START[\s\S]*?\/\/\s*EMBEDDED_VOCABULARY_END/,
                scriptReplacement
            );

            finalHtml = finalHtml.replace(
                /\/\/\s*LEARNER_FLAG_START[\s\S]*?\/\/\s*LEARNER_FLAG_END/,
                `// LEARNER_FLAG_START\n        window.isLearnerVersion = true;\n        // LEARNER_FLAG_END`
            );

            const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tibetan_vocab_learner.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importHTMLFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const fileText = e.target.result;
                let importedData = null;

                try {
                    if (file.name.endsWith('.json')) {
                        importedData = JSON.parse(fileText);
                    } else {
                        const regexMatch = fileText.match(/\/\/\s*EMBEDDED_VOCABULARY_START\s*let\s+vocabulary\s*=\s*([\s\S]*?);\s*\/\/\s*EMBEDDED_VOCABULARY_END/);
                        if (regexMatch && regexMatch[1]) {
                            importedData = eval(regexMatch[1]);
                        } else {
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(fileText, 'text/html');
                            const scripts = doc.querySelectorAll('script');
                            scripts.forEach(s => {
                                const match = s.textContent.match(/let\s+vocabulary\s*=\s*(\[[\s\S]*?\]);/);
                                if (match && match[1]) {
                                    importedData = eval(match[1]);
                                }
                            });
                        }
                    }

                    if (Array.isArray(importedData) && importedData.length > 0) {
                        if (confirm(`Replace active vocabulary deck with the ${importedData.length} item(s) from this backup file?`)) {
                            vocabulary = importedData;
                            renderVocabList();
                            alert(`Success! Restored ${importedData.length} vocabulary item(s) from your backup file.`);
                            initQuiz();
                        }
                    } else {
                        alert("Could not locate valid vocabulary data inside the uploaded file.");
                    }
                } catch (err) {
                    alert("Error parsing backup file: " + err.message);
                }

                event.target.value = '';
            };

            reader.readAsText(file);
        }

        document.addEventListener('DOMContentLoaded', () => {
            purgeManagerElementsIfLearner();

            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.getVoices();
                };
            }

            const categoryFilterSelect = document.getElementById('category-filter-select');
            if (categoryFilterSelect) {
                categoryFilterSelect.onchange = (e) => {
                    selectedCategory = e.target.value;
                    initQuiz();
                };
            }

            const sessionSizeSelect = document.getElementById('session-size-select');
            if (sessionSizeSelect) {
                sessionSizeSelect.onchange = (e) => {
                    selectedSessionSize = e.target.value;
                    initQuiz();
                };
            }

            const cardCountSelect = document.getElementById('card-count-select');
            if (cardCountSelect) {
                cardCountSelect.onchange = (e) => {
                    selectedCardCount = e.target.value;
                    initQuiz();
                };
            }

            const stageSelect = document.getElementById('stage-select');
            if (stageSelect) {
                stageSelect.onchange = (e) => {
                    currentStage = parseInt(e.target.value);
                    initQuiz();
                };
            }

            const toggleWylieBtn = document.getElementById('toggle-wylie-btn');
            if (toggleWylieBtn) toggleWylieBtn.onclick = toggleWylie;

            const toggleAudioBtn = document.getElementById('toggle-audio-btn');
            if (toggleAudioBtn) toggleAudioBtn.onclick = toggleAudio;

            const nextBtn = document.getElementById('next-btn');
            if (nextBtn) nextBtn.onclick = handleNextButtonClick;

            const closeBtn = document.getElementById('close-btn');
            if (closeBtn) closeBtn.onclick = () => switchView('manager');

            const quizResetBtn = document.getElementById('quiz-reset-btn');
            if (quizResetBtn) quizResetBtn.onclick = resetQuizProgressOnly;

            const navManageBtn = document.getElementById('nav-manage-btn');
            if (navManageBtn) navManageBtn.onclick = () => switchView('manager');

            const backToQuizBtn = document.getElementById('back-to-quiz-btn');
            if (backToQuizBtn) backToQuizBtn.onclick = () => initQuiz();

            const openAddBtn = document.getElementById('open-add-modal-btn');
            if (openAddBtn) openAddBtn.onclick = () => openEditModal(-1);
